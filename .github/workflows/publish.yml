name: Build & Publish

on:
  repository_dispatch:
    types: [upstream-published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-casehubio</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # AvatarCompilerTest compiles a "vits" TTS engine, which needs the native espeak-ng library.
      # Provisioner looks in ~/.casehub/native/espeak-ng/<version>/<platform>/ (or /usr/lib,
      # /usr/local/lib), not in Ubuntu's multiarch dir, so link the packaged library there.
      - name: Install espeak-ng (PR tests)
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libespeak-ng1 espeak-ng-data
          dir="$HOME/.casehub/native/espeak-ng/1.52.0/linux-x64"
          mkdir -p "$dir"
          lib=$(ls /usr/lib/x86_64-linux-gnu/libespeak-ng.so.* | head -1)
          ln -sf "$lib" "$dir/libespeak-ng.so"
          ln -sfn /usr/lib/x86_64-linux-gnu/espeak-ng-data "$dir/espeak-ng-data"
          ls -l "$dir"

      - name: Build (PR)
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode install -U
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (push to main)
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy -DskipTests -U
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        if: github.event_name != 'pull_request' && success()
        run: |
          for repo in drafthouse claudony openclaw; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
