type: supervisor
name: expression-routed-supervisor
description: "Supervisor using expression-based routing to select specialist or generalist"
task: supervised-dispatch
routing:
  type: first-match
  guard: "ref.name() == \"specialist\""
termination:
  - type: goal-reached
    when: "completed == true"
  - type: max-iterations
    iterations: 10
agents:
  - type: worker
    name: specialist
    description: "Handles domain-specific tasks requiring deep expertise"
    capabilities:
      - domain-expertise
      - specialised-analysis
  - type: worker
    name: generalist
    description: "Handles broad tasks not requiring specialist knowledge"
    capabilities:
      - general-processing
      - triage
