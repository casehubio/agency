type: supervisor
name: supervised-analysis
description: "Supervisor coordinates analyst and reviewer with oversight governance"
task: analysis
routing:
  type: first-match
  guard: "priority > 5"
termination:
  - type: max-iterations
    iterations: 20
aggregation:
  type: collect-all
governance:
  oversight:
    classifier: risk-based
    reversible: true
    candidateGroups:
      - senior-reviewers
  trustRouting:
    threshold: 0.7
    minimumObservations: 10
    borderlineMargin: 0.1
    blendFactor: 0.6
  attestation:
    observer: capability-attestation
    capabilityTag: data-analysis
agents:
  - type: worker
    name: analyst
    description: "Analyses input data"
    capabilities:
      - data-analysis
  - type: worker
    name: reviewer
    description: "Reviews analysis results for accuracy and completeness"
    capabilities:
      - quality-review
      - fact-checking
