type: conditional
name: domain-case-router
description: "Routes cases to domain specialists based on category classification"
task: routing
termination:
  - type: agent-count
failurePolicy:
  onRoutingFailure: ESCALATE
  onDeadlock: FAIL
branches:
  - condition: "category == 'medical'"
    description: "Routes clinical cases requiring specialist medical review"
    agent:
      type: worker
      name: medical-expert
  - condition: "category == 'legal'"
    description: "Routes matters requiring legal analysis and regulatory review"
    agent:
      type: worker
      name: legal-expert
  - condition: "category == 'financial'"
    description: "Routes cases requiring financial risk and compliance evaluation"
    agent:
      type: worker
      name: financial-expert
agents:
  - type: worker
    name: medical-expert
    description: "Analyses medical cases with clinical guideline awareness"
    capabilities:
      - clinical-analysis
      - guideline-compliance
  - type: worker
    name: legal-expert
    description: "Reviews legal matters against regulatory frameworks"
    capabilities:
      - legal-analysis
      - regulatory-review
  - type: worker
    name: financial-expert
    description: "Evaluates financial cases for risk and compliance"
    capabilities:
      - financial-analysis
      - compliance-checking
