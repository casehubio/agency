type: voting
name: proposal-evaluation
description: "Three evaluators assess proposals across technical, financial, and strategic dimensions"
task: evaluation
aggregation:
  type: majority-vote
termination:
  - type: single-pass
judgment:
  trigger:
    type: confidence-threshold
    threshold: 0.7
    extractor: "result.confidence"
  caller:
    type: fan-out
    callerNames:
      - senior-reviewer
      - domain-lead
    agreement:
      type: majority
failurePolicy:
  onRoutingFailure: FAIL
  onDeadlock: ESCALATE
agents:
  - type: worker
    name: evaluator-1
    description: "Assesses technical feasibility and implementation risk"
    capabilities:
      - technical-assessment
      - risk-analysis
  - type: worker
    name: evaluator-2
    description: "Reviews cost-benefit and resource requirements"
    capabilities:
      - cost-analysis
      - resource-planning
  - type: human
    name: domain-expert
    description: "Provides domain-specific judgment from a human panellist"
    capabilities:
      - domain-expertise
      - strategic-assessment
