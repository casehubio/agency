type: voting
name: proposal-evaluation
description: "Three evaluators assess proposals across technical, financial, and strategic dimensions"
task: evaluation
aggregation:
  type: majority-vote
termination:
  - type: single-pass
  - type: max-iterations
    iterations: 3
judgment:
  trigger:
    type: confidence-threshold
    threshold: 0.7
    extractor: "result.confidence"
  caller:
    type: fan-out
    callerNames:
      - senior-reviewer
      - domain-lead
    agreement:
      type: majority
failurePolicy:
  onRoutingFailure: FAIL
  onDeadlock: ESCALATE
agents:
  - type: worker
    name: quantitative-scorer
    description: "Applies statistical risk models and quantitative analysis to score proposals"
    capabilities:
      - risk-modelling
      - quantitative-analysis
    model: claude-opus-5
  - type: worker
    name: qualitative-reviewer
    description: "Evaluates contextual factors, stakeholder impact, and strategic alignment"
    capabilities:
      - contextual-analysis
      - stakeholder-assessment
    model: claude-sonnet-5
  - type: human
    name: regulatory-checker
    description: "Verifies proposals against compliance rules and regulatory frameworks"
    capabilities:
      - compliance-checking
      - regulatory-review
