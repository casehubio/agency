type: loop
name: iterative-refinement
description: "Repeatedly refines output quality until the threshold is met or iterations are exhausted"
task: refinement
maxIterations: 15
exitCondition: "qualityScore > 0.9"
termination:
  - type: goal-reached
    when: "qualityScore > 0.95"
  - type: max-iterations
    iterations: 15
judgment:
  trigger:
    type: iteration-based
    every: 5
  caller:
    type: single
    callerName: quality-assessor
agents:
  - type: worker
    name: improver
    description: "Iteratively refines output quality through self-critique and revision"
    capabilities:
      - content-generation
      - self-evaluation
      - revision
