type: parallel
name: multi-source-research
description: "Concurrent research across web, academic, and internal sources"
task: research
aggregation:
  type: collect-all
termination:
  - type: agent-count
failurePolicy:
  onRoutingFailure: FAIL
  onDeadlock: FAIL
agents:
  - type: worker
    name: web-researcher
    description: "Searches public web sources for relevant information"
    capabilities:
      - web-search
      - content-extraction
  - type: worker
    name: academic-researcher
    description: "Queries academic databases and citation networks"
    capabilities:
      - academic-search
      - citation-analysis
  - type: external
    name: data-api
    description: "Retrieves structured records from an external data service"
    capabilities:
      - api-integration
      - structured-retrieval
