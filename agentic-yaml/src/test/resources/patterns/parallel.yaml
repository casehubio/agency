type: parallel
aggregation:
  type: collect-all
termination:
  - type: agent-count
failurePolicy:
  onRoutingFailure: FAIL
  onDeadlock: FAIL
agents:
  - type: worker
    name: web-researcher
    description: "Searches public web sources for relevant information"
    capabilities:
      - web-search
      - content-extraction
  - type: worker
    name: academic-researcher
    description: "Queries academic databases and citation networks"
    capabilities:
      - academic-search
      - citation-analysis
  - type: worker
    name: internal-researcher
    description: "Retrieves relevant records from internal knowledge bases"
    capabilities:
      - database-query
      - knowledge-retrieval
