casehub.avatar.agent-id=speech-demo-avatar

# Jandex index for blocks dependencies
quarkus.index-dependency.casehub-agency-speech-ws.group-id=io.casehub
quarkus.index-dependency.casehub-agency-speech-ws.artifact-id=casehub-agency-speech-ws
quarkus.index-dependency.casehub-agency-agentic-yaml.group-id=io.casehub
quarkus.index-dependency.casehub-agency-agentic-yaml.artifact-id=casehub-agency-agentic-yaml
quarkus.index-dependency.casehub-platform-agent-session.group-id=io.casehub
quarkus.index-dependency.casehub-platform-agent-session.artifact-id=casehub-platform-agent-session

# eidos JPA stores need a datasource — in-memory H2 for the demo
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:speech-demo
quarkus.hibernate-orm.database.generation=drop-and-create

# agentic-yaml's AgencySpecsResource requires pattern specs not present in speech-demo
quarkus.arc.exclude-types=io.casehub.agency.core.yaml.runtime.AgencySpecsResource
