<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CC0 Retarget — Two-Pass (GLB Rest → Canonical → Avatar)</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 400px; }
  #status { padding: 0.4rem; text-align: center; font-size: 0.85rem; color: #999; border-bottom: 1px solid #333; }
  #controls { padding: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-height: 120px; overflow-y: auto; }
  #controls button { padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: 0.75rem; }
  #controls button:hover { background: #3a3a5e; }
  #controls button.active { background: #2d5aa0; border-color: #2d5aa0; }
  #diag { padding: 0.4rem; font-size: 0.7rem; color: #777; text-align: center; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="status">Loading...</div>
<div id="controls"></div>
<div id="diag"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CANONICAL_REST, retargetClipToObject } from "./animations/retarget.mjs";

var statusEl = document.getElementById('status');
var controlsEl = document.getElementById('controls');
var diagEl = document.getElementById('diag');
var viewportEl = document.getElementById('viewport');

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
var camera = new THREE.PerspectiveCamera(35, viewportEl.clientWidth / viewportEl.clientHeight, 0.01, 100);
camera.position.set(0, 1.2, 2.5);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewportEl.clientWidth, viewportEl.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewportEl.appendChild(renderer.domElement);
var orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, 0);
orbit.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(2, 3, 2);
scene.add(dl);
window.addEventListener('resize', function() {
  camera.aspect = viewportEl.clientWidth / viewportEl.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewportEl.clientWidth, viewportEl.clientHeight);
});

var mixer = null, currentAction = null, activeBtn = null, clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
animate();

async function init() {
  var loader = new GLTFLoader();
  statusEl.textContent = 'Loading avatar...';
  var avatarGltf = await new Promise(function(res, rej) { loader.load('avatar.glb', res, null, rej); });
  var avatarModel = avatarGltf.scene;
  scene.add(avatarModel);
  mixer = new THREE.AnimationMixer(avatarModel);

  statusEl.textContent = 'Loading animations...';
  var animGltf = await new Promise(function(res, rej) { loader.load('animations/cc0-animations-v2.glb', res, null, rej); });

  // ── Extract M2M rest from GLB skeleton's node.quaternion ──────────
  // This is the bone's actual rest pose in the GLB's coordinate frame —
  // more accurate than Idle_Subtle frame 0 (which includes animation).
  var glbRest = {};
  animGltf.scene.traverse(function(n) {
    if (n.isBone && n.name && CANONICAL_REST[n.name]) {
      glbRest[n.name] = n.quaternion.clone();
    }
  });
  console.log('GLB skeleton rest:', Object.keys(glbRest).length, 'bones');

  // ── Pass 1: GLB rest → Canonical (local rest swap) ────────────────
  // P[bone] = canonical_rest × inv(glb_rest)
  // corrected[N] = P × keyframe[N]
  // Skip Hips — Hips keyframes were already converted by Blender retarget
  var boneCorrections = {};
  var corrCount = 0;
  var tmpQ = new THREE.Quaternion();

  Object.keys(glbRest).forEach(function(bone) {
    if (bone === 'Hips') return;
    var canonArr = CANONICAL_REST[bone];
    if (!canonArr) return;
    var canonQ = new THREE.Quaternion(canonArr[0], canonArr[1], canonArr[2], canonArr[3]);
    var glbQ = glbRest[bone];
    var P = canonQ.clone().multiply(glbQ.clone().invert());
    if (1 - Math.abs(P.w) < 1e-6) return;
    boneCorrections[bone] = P;
    corrCount++;

    // Log large corrections for diagnostics
    var angle = 2 * Math.acos(Math.min(1, Math.abs(P.w))) * 180 / Math.PI;
    if (angle > 20) console.log('  Correction', bone, ':', angle.toFixed(1) + '°');
  });
  console.log('Pass 1 corrections:', corrCount);

  // Apply pass 1 corrections to all clips
  var correctedClips = animGltf.animations.map(function(clip) {
    var corrClip = clip.clone();
    corrClip.tracks = clip.tracks.map(function(track) {
      var next = track.clone();
      if (!next.name.endsWith('.quaternion')) return next;
      var bone = next.name.split('.')[0];
      var P = boneCorrections[bone];
      if (!P) return next;
      for (var i = 0; i < next.values.length; i += 4) {
        tmpQ.set(next.values[i], next.values[i+1], next.values[i+2], next.values[i+3]);
        tmpQ.premultiply(P);
        next.values[i] = tmpQ.x;
        next.values[i+1] = tmpQ.y;
        next.values[i+2] = tmpQ.z;
        next.values[i+3] = tmpQ.w;
      }
      return next;
    });
    return corrClip;
  });

  // ── Pass 2: Canonical → Avatar (retargetClipToObject) ────────────
  var loaded = 0;
  correctedClips.forEach(function(clip) {
    var result = retargetClipToObject(clip, avatarModel, { minCoverage: 0.1 });
    var retClip = result && result.clip ? result.clip : null;
    if (!retClip) return;
    loaded++;

    var label = clip.name.replace(/_RT$/, '').replace(/_/g, ' ');
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', function() {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      if (currentAction) currentAction.fadeOut(0.3);
      var action = mixer.clipAction(retClip);
      action.reset().fadeIn(0.3).play();
      currentAction = action;
      statusEl.textContent = 'Playing: ' + label;
    });
    controlsEl.appendChild(btn);
  });

  diagEl.textContent = loaded + ' animations retargeted (two-pass: GLB rest → canonical → avatar), ' + corrCount + ' pass-1 corrections';
  statusEl.textContent = 'Ready — click any animation';
}

init().catch(function(e) {
  statusEl.textContent = 'Error: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
