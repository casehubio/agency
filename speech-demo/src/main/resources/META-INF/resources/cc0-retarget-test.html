<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CC0 T-Pose Delta Retarget Test</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 400px; }
  #status { padding: 0.5rem; text-align: center; font-size: 0.85rem; color: #999; border-bottom: 1px solid #333; }
  #controls { padding: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; max-height: 150px; overflow-y: auto; }
  #controls button { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: 0.8rem; }
  #controls button:hover { background: #3a3a5e; }
  #controls button.active { background: #2d5aa0; border-color: #2d5aa0; }
  #diag { padding: 0.5rem; font-size: 0.75rem; color: #777; text-align: center; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="status">Loading...</div>
<div id="controls"></div>
<div id="diag"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { canonicalRestMapFromObject, canonicalWorldRestMapFromObject, canonicalNodeMapFromObject, hipsParentWorldQuat, hipRestLocalHeight, clipHipBaselineY } from "./animations/retarget.mjs";

// ── M2M source skeleton LOCAL rest [x,y,z,w] ───────────────────────
// Extracted from animation-human-rest-pose.blend via Blender glTF export.
// Hips keyframes were already converted by Blender retarget — skip Hips.
var M2M_REST = {
  Head: [-0.203031, 0, 0, 0.979172],
  Hips: [0.790468, 0, 0, 0.612503],
  LeftArm: [0.192103, 0.660515, -0.267884, 0.674577],
  LeftFoot: [-0.586511, 0.000526, -0.000227, 0.809941],
  LeftForeArm: [0.021641, 0.000287, -0.006738, 0.999743],
  LeftHand: [-0.008400, -0.000060, 0.009398, 0.999921],
  LeftHandIndex1: [0.061252, 0.704452, 0.061252, 0.704446],
  LeftHandIndex2: [0, 0, 0.010773, 0.999942],
  LeftHandIndex3: [0, 0, 0.010879, 0.999941],
  LeftHandMiddle1: [0.018655, 0.706863, 0.018655, 0.706858],
  LeftHandMiddle2: [0, 0, 0.002188, 0.999998],
  LeftHandMiddle3: [0, 0, 0.024181, 0.999708],
  LeftHandPinky1: [-0.027719, 0.706566, -0.027719, 0.706560],
  LeftHandPinky2: [0, 0, -0.013902, 0.999903],
  LeftHandPinky3: [0, 0, 0.012939, 0.999916],
  LeftHandRing1: [-0.012589, 0.706997, -0.012589, 0.706992],
  LeftHandRing2: [0, 0, 0.019747, 0.999805],
  LeftHandRing3: [0, 0, 0.004022, 0.999992],
  LeftHandThumb1: [0.249777, 0.917359, 0.300277, 0.076796],
  LeftHandThumb2: [0.082695, -0.004105, 0.008713, 0.996528],
  LeftHandThumb3: [0.038974, -0.006633, 0.022494, 0.998965],
  LeftLeg: [0.100033, -0.000131, -0.000013, 0.994984],
  LeftShoulder: [-0.530812, -0.288154, -0.314649, 0.732259],
  LeftToeBase: [0.000111, 0.976743, -0.214414, 0.000506],
  LeftUpLeg: [0.989046, 0, 0, 0.147611],
  Neck: [0.349636, 0, 0, 0.936885],
  RightArm: [0.192103, -0.660515, 0.267884, 0.674577],
  RightFoot: [-0.586511, -0.000526, 0.000227, 0.809941],
  RightForeArm: [0.021641, -0.000287, 0.006738, 0.999743],
  RightHand: [-0.008400, 0.000060, -0.009398, 0.999921],
  RightHandIndex1: [0.061252, -0.704452, -0.061252, 0.704446],
  RightHandIndex2: [0, 0, -0.010773, 0.999942],
  RightHandIndex3: [0, 0, -0.010879, 0.999941],
  RightHandMiddle1: [0.018655, -0.706863, -0.018655, 0.706858],
  RightHandMiddle2: [0, 0, -0.002188, 0.999998],
  RightHandMiddle3: [0, 0, -0.024181, 0.999708],
  RightHandPinky1: [-0.027719, -0.706566, 0.027719, 0.706560],
  RightHandPinky2: [0, 0, 0.013902, 0.999903],
  RightHandPinky3: [0, 0, -0.012939, 0.999916],
  RightHandRing1: [-0.012589, -0.706997, 0.012589, 0.706992],
  RightHandRing2: [0, 0, -0.019747, 0.999805],
  RightHandRing3: [0, 0, -0.004022, 0.999992],
  RightHandThumb1: [0.249777, -0.917359, -0.300277, 0.076796],
  RightHandThumb2: [0.082695, 0.004105, -0.008713, 0.996528],
  RightHandThumb3: [0.038974, 0.006633, -0.022494, 0.998965],
  RightLeg: [0.100033, 0.000131, 0.000013, 0.994984],
  RightShoulder: [-0.530812, 0.288154, 0.314649, 0.732259],
  RightToeBase: [0.000111, -0.976743, 0.214414, 0.000506],
  RightUpLeg: [0.989046, 0, 0, 0.147611],
  Spine: [-0.064703, 0, 0, 0.997905],
  Spine1: [-0.077280, 0, 0, 0.997009],
  Spine2: [-0.093324, 0, 0, 0.995636],
};

var PARENT = {
  Hips: null, Spine: 'Hips', Spine1: 'Spine', Spine2: 'Spine1',
  Neck: 'Spine2', Head: 'Neck',
  LeftShoulder: 'Spine2', LeftArm: 'LeftShoulder', LeftForeArm: 'LeftArm', LeftHand: 'LeftForeArm',
  RightShoulder: 'Spine2', RightArm: 'RightShoulder', RightForeArm: 'RightArm', RightHand: 'RightForeArm',
  LeftUpLeg: 'Hips', LeftLeg: 'LeftUpLeg', LeftFoot: 'LeftLeg', LeftToeBase: 'LeftFoot',
  RightUpLeg: 'Hips', RightLeg: 'RightUpLeg', RightFoot: 'RightLeg', RightToeBase: 'RightFoot',
};
['Left','Right'].forEach(function(s) {
  ['Index','Middle','Ring','Pinky','Thumb'].forEach(function(f) {
    PARENT[s+'Hand'+f+'1'] = s+'Hand';
    PARENT[s+'Hand'+f+'2'] = s+'Hand'+f+'1';
    PARENT[s+'Hand'+f+'3'] = s+'Hand'+f+'2';
  });
});

var status = document.getElementById('status');
var controls = document.getElementById('controls');
var diag = document.getElementById('diag');
var viewport = document.getElementById('viewport');

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
var camera = new THREE.PerspectiveCamera(35, viewport.clientWidth / viewport.clientHeight, 0.01, 100);
camera.position.set(0, 1.2, 2.5);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);
var orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, 0);
orbit.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(2, 3, 2);
scene.add(dl);
window.addEventListener('resize', function() {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});

var mixer = null, currentAction = null, activeBtn = null, clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
animate();

async function init() {
  var loader = new GLTFLoader();
  status.textContent = 'Loading avatar...';
  var avatarGltf = await new Promise(function(r,e) { loader.load('avatar.glb', r, null, e); });
  var avatarModel = avatarGltf.scene;
  scene.add(avatarModel);
  mixer = new THREE.AnimationMixer(avatarModel);

  status.textContent = 'Loading animations...';
  var animGltf = await new Promise(function(r,e) { loader.load('animations/cc0-animations-v2.glb', r, null, e); });

  // Avatar target rest (local + world)
  var avatarLocalRest = canonicalRestMapFromObject(avatarModel);
  var avatarWorldRest = canonicalWorldRestMapFromObject(avatarModel);
  var avatarNodeMap = canonicalNodeMapFromObject(avatarModel);
  var avatarHipY = hipRestLocalHeight(avatarModel);
  var avatarHipsParent = hipsParentWorldQuat(avatarModel);

  // M2M source rest (local + world)
  // Hips parent in M2M was a root bone with -90° X, BUT the Blender retarget
  // already baked this into the Hips keyframes. So for world rest computation,
  // treat Hips parent as IDENTITY (matching the avatar's setup).
  var m2mLocal = new Map();
  var m2mWorld = new Map();
  Object.keys(M2M_REST).forEach(function(bone) {
    var q = M2M_REST[bone];
    m2mLocal.set(bone, new THREE.Quaternion(q[0], q[1], q[2], q[3]));
  });

  // For Hips: use avatar's world rest (keyframes already converted).
  // For children: avatar-Hips-world × M2M child local rests.
  m2mWorld.set('Hips', avatarWorldRest.get('Hips').clone());

  function getM2mWorld(bone) {
    if (m2mWorld.has(bone)) return m2mWorld.get(bone);
    var local = m2mLocal.get(bone);
    if (!local) return null;
    var p = PARENT[bone];
    if (!p) { m2mWorld.set(bone, local.clone()); return m2mWorld.get(bone); }
    var pw = getM2mWorld(p);
    if (!pw) { m2mWorld.set(bone, local.clone()); return m2mWorld.get(bone); }
    var w = pw.clone().multiply(local);
    m2mWorld.set(bone, w);
    return w;
  }
  for (var bone of m2mLocal.keys()) { if (bone !== 'Hips') getM2mWorld(bone); }
  console.log('M2M local:', m2mLocal.size, 'world:', m2mWorld.size);
  console.log('Avatar local:', avatarLocalRest.size, 'world:', avatarWorldRest.size);

  // Full L/R bind corrections: M2M → avatar, skip Hips
  var BIND_EPS = 1e-6;
  var bindCorr = new Map();
  for (var [bname, Rs] of m2mLocal) {
    if (bname === 'Hips') continue;
    var Rt = avatarLocalRest.get(bname);
    var Ws = m2mWorld.get(bname);
    var Wt = avatarWorldRest.get(bname);
    if (!Rt || !Ws || !Wt) continue;
    var L = Rt.clone().multiply(Wt.clone().invert()).multiply(Ws.clone()).multiply(Rs.clone().invert());
    var R = Ws.clone().invert().multiply(Wt);
    var idL = (1 - Math.abs(L.w)) < BIND_EPS;
    var idR = (1 - Math.abs(R.w)) < BIND_EPS;
    if (idL && idR) continue;
    bindCorr.set(bname, { L: idL ? null : L, R: idR ? null : R });
  }
  console.log('Bind corrections (M2M→avatar, skip Hips):', bindCorr.size);

  // Hip position correction
  var hipPosCorr = null;
  if (avatarHipsParent) {
    var hpq = avatarHipsParent.clone().invert();
    if (1 - Math.abs(hpq.w) >= BIND_EPS) hipPosCorr = hpq;
  }

  // Apply corrections and build UI — play directly, no retargetClipToObject
  var tmpQ = new THREE.Quaternion();
  var tmpV = new THREE.Vector3();
  var loaded = 0;
  animGltf.animations.forEach(function(clip) {
    clip.tracks.forEach(function(track) {
      if (!track.name.endsWith('.quaternion')) return;
      var bone = track.name.split('.')[0];
      var corr = bindCorr.get(bone);
      if (!corr) return;
      for (var i = 0; i < track.values.length; i += 4) {
        tmpQ.set(track.values[i], track.values[i+1], track.values[i+2], track.values[i+3]);
        if (corr.L) tmpQ.premultiply(corr.L);
        if (corr.R) tmpQ.multiply(corr.R);
        track.values[i] = tmpQ.x; track.values[i+1] = tmpQ.y;
        track.values[i+2] = tmpQ.z; track.values[i+3] = tmpQ.w;
      }
    });
    loaded++;

    var label = clip.name.replace(/_RT$/, '').replace(/_/g, ' ');
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', function() {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      if (currentAction) currentAction.fadeOut(0.3);
      var action = mixer.clipAction(clip);
      action.reset().fadeIn(0.3).play();
      currentAction = action;
      status.textContent = 'Playing: ' + label;
    });
    controls.appendChild(btn);
  });

  diag.textContent = loaded + ' animations, ' + bindCorr.size + ' L/R corrections (M2M Blender rest, Hips skipped, no retargetClipToObject)';
  status.textContent = 'Ready — click any animation';
}

init().catch(function(e) { status.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
