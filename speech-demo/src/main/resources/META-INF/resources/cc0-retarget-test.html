<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CC0 T-Pose Delta Retarget Test</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 400px; }
  #status { padding: 0.5rem; text-align: center; font-size: 0.85rem; color: #999; border-bottom: 1px solid #333; }
  #controls { padding: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; max-height: 150px; overflow-y: auto; }
  #controls button { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: 0.8rem; }
  #controls button:hover { background: #3a3a5e; }
  #controls button.active { background: #2d5aa0; border-color: #2d5aa0; }
  #diag { padding: 0.5rem; font-size: 0.75rem; color: #777; text-align: center; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="status">Loading...</div>
<div id="controls"></div>
<div id="diag"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { retargetClipToObject } from "./animations/retarget.mjs";

var status = document.getElementById('status');
var controls = document.getElementById('controls');
var diag = document.getElementById('diag');
var viewport = document.getElementById('viewport');

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
var camera = new THREE.PerspectiveCamera(35, viewport.clientWidth / viewport.clientHeight, 0.01, 100);
camera.position.set(0, 1.2, 2.5);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);
var orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, 0);
orbit.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(2, 3, 2);
scene.add(dl);
window.addEventListener('resize', function() {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});

var mixer = null, currentAction = null, activeBtn = null, clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
animate();

async function init() {
  var loader = new GLTFLoader();
  status.textContent = 'Loading avatar...';
  var avatarGltf = await new Promise(function(r,e) { loader.load('avatar.glb', r, null, e); });
  var avatarModel = avatarGltf.scene;
  scene.add(avatarModel);
  mixer = new THREE.AnimationMixer(avatarModel);

  // Load the RAW M2M animation (original bone names, original rest poses)
  // retargetClipToObject handles name mapping AND axis conversion
  status.textContent = 'Loading Blender-retargeted animation...';
  var rawGltf = await new Promise(function(r,e) { loader.load('/m2m-retargeted-idle-subtle.glb', r, null, e); });

  console.log('Raw M2M clips:', rawGltf.animations.length);
  console.log('Raw M2M bones:');
  rawGltf.scene.traverse(function(n) {
    if (n.isBone && n.name) console.log('  ' + n.name);
  });

  var loaded = 0;
  rawGltf.animations.forEach(function(clip) {
    var result = retargetClipToObject(clip, avatarModel, { minCoverage: 0.1 });
    var retClip = result && result.clip ? result.clip : null;
    if (!retClip) {
      console.warn('Retarget failed:', clip.name, 'coverage:', result ? result.coverage : 'null');
      return;
    }
    loaded++;
    console.log('Retargeted:', clip.name, 'coverage:', result.coverage.toFixed(2), 'matched:', result.matched + '/' + result.total);

    var label = clip.name.replace(/_RT$/, '').replace(/_/g, ' ');
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', function() {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      if (currentAction) currentAction.fadeOut(0.3);
      var action = mixer.clipAction(retClip);
      action.reset().fadeIn(0.3).play();
      currentAction = action;
      status.textContent = 'Playing: ' + label;
    });
    controls.appendChild(btn);
  });

  diag.textContent = loaded + ' raw M2M animations retargeted directly via retargetClipToObject';
  status.textContent = 'Ready — click any animation';
}

init().catch(function(e) { status.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
