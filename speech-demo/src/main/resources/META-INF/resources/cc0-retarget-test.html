<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CC0 T-Pose Delta Retarget Test</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 400px; }
  #status { padding: 0.5rem; text-align: center; font-size: 0.85rem; color: #999; border-bottom: 1px solid #333; }
  #controls { padding: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; max-height: 150px; overflow-y: auto; }
  #controls button { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
  #controls button:hover { background: #3a3a5e; }
  #controls button.active { background: #2d5aa0; border-color: #2d5aa0; }
  #diag { padding: 0.5rem; font-size: 0.75rem; color: #777; text-align: center; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="status">Loading...</div>
<div id="controls"></div>
<div id="diag"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CANONICAL_REST, CANONICAL_REST_WORLD, canonicalRestMapFromObject, canonicalWorldRestMapFromObject, hipsParentWorldQuat, hipRestLocalHeight, clipHipBaselineY, canonicalNodeMapFromObject } from "./animations/retarget.mjs";

var status = document.getElementById('status');
var controls = document.getElementById('controls');
var diag = document.getElementById('diag');
var viewport = document.getElementById('viewport');

// ── THREE.js setup ───────────────────────────────────────────────────
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

var camera = new THREE.PerspectiveCamera(35, viewport.clientWidth / viewport.clientHeight, 0.01, 100);
camera.position.set(0, 1.2, 2.5);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

var orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, 0);
orbit.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);

window.addEventListener('resize', function() {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});

// ── State ────────────────────────────────────────────────────────────
var mixer = null;
var currentAction = null;
var activeBtn = null;
var clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  var dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  renderer.render(scene, camera);
}
animate();

// ── Load ─────────────────────────────────────────────────────────────
async function init() {
  var loader = new GLTFLoader();
  status.textContent = 'Loading avatar...';

  // Load avatar
  var avatarGltf = await new Promise(function(res, rej) { loader.load('avatar.glb', res, null, rej); });
  var avatarModel = avatarGltf.scene;
  scene.add(avatarModel);
  window._avatarModel = avatarModel;
  mixer = new THREE.AnimationMixer(avatarModel);
  status.textContent = 'Loading animations...';

  // Load CC0 animations
  var animGltf = await new Promise(function(res, rej) { loader.load('animations/cc0-animations-v2.glb', res, null, rej); });

  // ── T-pose delta retarget ────────────────────────────────────────
  // Find neutral clip for M2M rest extraction
  var neutralClip = animGltf.animations.find(function(c) { return c.name.indexOf('Idle_Subtle') >= 0; });
  if (!neutralClip) neutralClip = animGltf.animations.find(function(c) { return c.name.indexOf('Idle') >= 0; });

  var m2mRest = {};
  if (neutralClip) {
    neutralClip.tracks.forEach(function(track) {
      if (!track.name.endsWith('.quaternion')) return;
      var bone = track.name.split('.')[0];
      m2mRest[bone] = new THREE.Quaternion(track.values[0], track.values[1], track.values[2], track.values[3]);
    });
    console.log('M2M rest from', neutralClip.name, ':', Object.keys(m2mRest).length, 'bones');
  }

  // ── Direct M2M→avatar retarget (single pass) ─────────────────────
  // Use M2M rest as SOURCE and avatar rest as TARGET.
  // retargetClip uses hard-coded CANONICAL_REST as source, so we
  // override by passing M2M rests as the "target" rest maps to
  // retargetClip, effectively swapping perspective: the clip is
  // treated as canonical-sourced, and the "target" corrections
  // encode the full M2M→avatar delta.
  //
  // Instead, we compute our own bind corrections directly:
  // L = Rt × inv(Wt) × Ws × inv(Rs)    (Rs=M2M, Rt=avatar)
  // R = inv(Ws) × Wt                     (Ws=M2M world, Wt=avatar world)

  // Get avatar's rest info
  var avatarNodeMap = canonicalNodeMapFromObject(avatarModel);
  var avatarLocalRest = canonicalRestMapFromObject(avatarModel);
  var avatarWorldRest = canonicalWorldRestMapFromObject(avatarModel);
  var avatarHipsParent = hipsParentWorldQuat(avatarModel);
  var avatarHipY = hipRestLocalHeight(avatarModel);
  var avatarHipGroundY = 0;

  console.log('Avatar: nodeMap size', avatarNodeMap.size,
    'localRest size', avatarLocalRest.size,
    'worldRest size', avatarWorldRest.size,
    'hipY', avatarHipY.toFixed(3));

  // Compute M2M world rests from local rests + bone hierarchy
  // Use the animation GLB's skeleton nodes for hierarchy
  var m2mLocalMap = new Map();
  var m2mWorldMap = new Map();

  // Build parent map from animation GLB skeleton
  var animSkeleton = null;
  animGltf.scene.traverse(function(n) {
    if (n.isBone && !animSkeleton) animSkeleton = n;
  });
  // Walk up to skeleton root
  if (animSkeleton) {
    while (animSkeleton.parent && animSkeleton.parent.isBone) animSkeleton = animSkeleton.parent;
  }

  // For M2M rest: at the neutral frame, the keyframe values ARE the
  // bone local rotations. Compute world rest by traversing the hierarchy.
  Object.keys(m2mRest).forEach(function(bone) {
    m2mLocalMap.set(bone, m2mRest[bone]);
  });

  // Compute world rests using animation GLB's actual node hierarchy
  function computeWorldRestFromNodes(root) {
    var worldMap = new Map();
    function walk(node, parentWorldQ) {
      var name = node.name;
      var localQ = m2mLocalMap.get(name);
      var worldQ;
      if (localQ) {
        worldQ = parentWorldQ.clone().multiply(localQ);
        worldMap.set(name, worldQ);
      } else {
        worldQ = parentWorldQ.clone().multiply(node.quaternion);
      }
      for (var i = 0; i < node.children.length; i++) {
        if (node.children[i].isBone) walk(node.children[i], worldQ);
      }
    }
    if (root) walk(root, new THREE.Quaternion());
    return worldMap;
  }
  m2mWorldMap = computeWorldRestFromNodes(animSkeleton);
  console.log('M2M world rests:', m2mWorldMap.size);

  // Compute bind corrections: M2M source → avatar target
  var BIND_EPS = 1e-6;
  var bindCorr = new Map();
  var corrCount = 0;
  for (var [bone, Rs] of m2mLocalMap) {
    var Rt = avatarLocalRest.get(bone);
    var Ws = m2mWorldMap.get(bone);
    var Wt = avatarWorldRest.get(bone);
    if (!Rt || !Ws || !Wt) continue;

    // L = Rt × inv(Wt) × Ws × inv(Rs)
    var L = Rt.clone()
      .multiply(Wt.clone().invert())
      .multiply(Ws.clone())
      .multiply(Rs.clone().invert());
    // R = inv(Ws) × Wt
    var R = Ws.clone().invert().multiply(Wt);

    var identityL = (1 - Math.abs(L.w)) < BIND_EPS;
    var identityR = (1 - Math.abs(R.w)) < BIND_EPS;
    if (identityL && identityR) continue;

    bindCorr.set(bone, {
      L: identityL ? null : L,
      R: identityR ? null : R
    });
    corrCount++;
  }
  console.log('Bind corrections (M2M→avatar):', corrCount);

  // Hip position correction
  var hipPosCorr = null;
  if (avatarHipsParent) {
    var hpq = avatarHipsParent.clone().invert();
    if (1 - Math.abs(hpq.w) >= BIND_EPS) hipPosCorr = hpq;
  }
  if (!hipPosCorr) {
    var hipsCorr = bindCorr.get('Hips');
    if (hipsCorr && hipsCorr.L) hipPosCorr = hipsCorr.L;
  }

  // Apply corrections and build buttons
  var tmpQ = new THREE.Quaternion();
  var tmpV = new THREE.Vector3();
  var loaded = 0;
  animGltf.animations.forEach(function(clip) {
    var tracks = [];
    var total = 0;
    var matched = 0;

    clip.tracks.forEach(function(track) {
      var dot = track.name.indexOf('.');
      if (dot === -1) return;
      var boneName = track.name.slice(0, dot);
      var property = track.name.slice(dot + 1);

      if (property === 'quaternion') {
        total++;
        var nodeName = avatarNodeMap.get(boneName);
        if (!nodeName) return;
        matched++;

        var next = track.clone();
        next.name = nodeName + '.quaternion';
        var corr = bindCorr.get(boneName);
        if (corr) {
          for (var i = 0; i < next.values.length; i += 4) {
            tmpQ.set(next.values[i], next.values[i+1], next.values[i+2], next.values[i+3]);
            if (corr.L) tmpQ.premultiply(corr.L);
            if (corr.R) tmpQ.multiply(corr.R);
            next.values[i]   = tmpQ.x;
            next.values[i+1] = tmpQ.y;
            next.values[i+2] = tmpQ.z;
            next.values[i+3] = tmpQ.w;
          }
        }
        tracks.push(next);
      } else if (property === 'position' && boneName === 'Hips') {
        total++;
        var hipsNode = avatarNodeMap.get('Hips');
        if (!hipsNode) return;
        matched++;

        var next = track.clone();
        next.name = hipsNode + '.position';
        // Hip position: rotate + scale + offset
        var baseline = clipHipBaselineY(clip);
        var hipScale = 1;
        if (avatarHipY > 0.05 && baseline > 0.05) {
          hipScale = Math.min(200, Math.max(0.2, avatarHipY / baseline));
        }
        for (var i = 0; i < next.values.length; i += 3) {
          if (hipPosCorr) {
            tmpV.set(next.values[i], next.values[i+1], next.values[i+2]).applyQuaternion(hipPosCorr);
            next.values[i] = tmpV.x; next.values[i+1] = tmpV.y; next.values[i+2] = tmpV.z;
          }
          if (hipScale !== 1) {
            next.values[i] *= hipScale; next.values[i+1] *= hipScale; next.values[i+2] *= hipScale;
          }
          if (avatarHipGroundY) next.values[i+1] += avatarHipGroundY;
        }
        tracks.push(next);
      }
    });

    if (total > 0 && matched / total < 0.5) {
      console.warn('Low coverage:', clip.name, matched + '/' + total);
      return;
    }

    var retClip = clip.clone();
    retClip.tracks = tracks;
    loaded++;

    var label = clip.name.replace(/_RT$/, '').replace(/_/g, ' ');
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', function() {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;

      if (currentAction) currentAction.fadeOut(0.3);
      var action = mixer.clipAction(retClip);
      action.reset().fadeIn(0.3).play();
      currentAction = action;
      status.textContent = 'Playing: ' + label;
    });
    controls.appendChild(btn);
  });

  diag.textContent = loaded + ' animations loaded, ' + corrCount + ' bone corrections applied (from ' + (neutralClip ? neutralClip.name : 'none') + ')';
  status.textContent = 'Ready — click any animation';
}

init().catch(function(e) {
  status.textContent = 'Error: ' + e.message;
  console.error(e);
});
</script>
</body>
</html>
