<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Speech Demo</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "./vendor/talkinghead.mjs"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1rem; text-align: center; border-bottom: 1px solid #333; }
  header h1 { font-size: 1.2rem; font-weight: 500; }
  #avatar-container { width: 100%; height: 450px; background: #111; position: relative; border-bottom: 1px solid #333; display: none; }
  #avatar-container.active { display: block; }
  #toggle-avatar { font-size: 0.8rem; color: #999; cursor: pointer; text-decoration: underline; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2d5aa0; }
  .msg.avatar { align-self: flex-start; background: #333; }
  .msg.system { align-self: center; background: transparent; color: #888; font-size: 0.8rem; }
  #controls { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.5rem 1rem; border-bottom: 1px solid #333; align-items: center; justify-content: center; }
  #controls label { font-size: 0.8rem; color: #999; }
  #controls select { padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.85rem; }
  #input-bar { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #333; }
  #input-bar input { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 1rem; }
  #input-bar input:focus { outline: none; border-color: #2d5aa0; }
  #input-bar button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #2d5aa0; color: white; font-size: 1rem; cursor: pointer; }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }
  #mic { padding: 0.75rem 1rem; border-radius: 8px; border: 2px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  #mic:disabled { opacity: 0.5; cursor: default; }
  #mic.recording { background: #d64; border-color: #d64; color: white; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  #status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #666; text-align: center; }
  #model-status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #999; text-align: center; }
  #model-status .downloading { color: #d9a547; }
  #model-status .ready { color: #4a9; }
  #model-status .error { color: #d64; }

</style>
</head>

  <button id="playAnim" style="padding:0.3rem 0.6rem;border-radius:6px;border:1px solid #555;background:#2a2a3e;color:#e0e0e0;cursor:pointer;font-size:0.85rem" title="Play selected animation">&#9654;</button>
</div>
<div style="text-align:center;padding:0.25rem"><span id="toggle-avatar">Show 3D Avatar</span></div>

<script type="module">
import { TalkingHead } from "talkinghead";
import { BodyAnimationSystem, FloorState } from "./animations/body-animations.mjs";

const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const micBtn = document.getElementById('mic');
const avatarContainer = document.getElementById('avatar-container');
const toggleAvatar = document.getElementById('toggle-avatar');
let ws;
let audioCtx;
let head = null;
let bodyAnim = null;
let micStream = null;
let micProcessor = null;
let micSource = null;
let recording = false;

// Turn tracking (D3, D5, D10)
let activeTurnSeq = -1;
let pendingSegments = new Map();
let turnAudioPlayed = new Set();
let turnComplete = false;
let turnSafetyTimer = null;
const TURN_SAFETY_TIMEOUT = 10000;

let baselineMood = 'neutral';
let turnMood = null;
let turnMoodTimer = null;
const TURN_MOOD_DECAY_MS = 3000;

function applyMood() {
  const effective = turnMood || baselineMood;
  if (head) head.setMood(effective);
}

function setTurnMood(mood) {
  clearTimeout(turnMoodTimer);
  turnMood = mood;
  applyMood();
  turnMoodTimer = setTimeout(() => { turnMood = null; applyMood(); }, TURN_MOOD_DECAY_MS);
}

function sendWsJson(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function enterFloorState(state) {
  if (!bodyAnim) return;
  bodyAnim.setFloorState(state);
}

function parseBinaryHeader(buffer) {
  const view = new DataView(buffer);
  return {
    version: view.getUint8(0),
    isFinal: view.getUint8(1) !== 0,
    segmentIndex: view.getUint16(2, true),
    turnSeq: view.getUint32(4, true),
  };
}

function resetTurnState() {
  pendingSegments.clear();
  turnAudioPlayed.clear();
  turnComplete = false;
  clearTimeout(turnSafetyTimer);
  turnSafetyTimer = null;
}

function checkTurnFinished() {
  if (!turnComplete) return;
  for (const [key, seg] of pendingSegments) {
    if (seg.hasAudio && !turnAudioPlayed.has(seg.index)) return;
  }
  enterFloorState(FloorState.IDLE);
  sendWsJson({ type: 'playbackComplete', turnSeq: activeTurnSeq });
  resetTurnState();
}

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws/avatar');

  ws.onopen = () => {
    status.textContent = 'Connected';
    msgInput.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    addMessage('Connected — type a message or hold Mic to talk.', 'system');
  };

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      const msg = JSON.parse(evt.data);
      switch (msg.type) {
        case 'transcript':
          addMessage(msg.text, 'user');
          break;

        case 'segment': {
          const key = `${msg.turnSeq}:${msg.index}`;
          pendingSegments.set(key, {
            index: msg.index,
            text: msg.text,
            hasAudio: msg.hasAudio,
            visemes: msg.visemes || [],
            cues: msg.cues || [],
          });
          if (msg.text) addMessage(msg.text, 'avatar');
          if (msg.turnSeq !== activeTurnSeq) {
            resetTurnState();
            activeTurnSeq = msg.turnSeq;
          }
          if (!head || !msg.hasAudio) {
            for (const cue of (msg.cues || [])) {
              if (cue.type === 'gesture' && bodyAnim) bodyAnim.triggerGesture(cue.tag);
              if (cue.type === 'mood') setTurnMood(cue.mood);
            }
          }
          if (!msg.hasAudio) {
            turnAudioPlayed.add(msg.index);
            checkTurnFinished();
          }
          break;
        }

        case 'turnComplete':
          turnComplete = true;
          if (msg.segmentCount === 0) {
            sendWsJson({ type: 'playbackComplete', turnSeq: msg.turnSeq });
            enterFloorState(FloorState.IDLE);
            resetTurnState();
          } else {
            checkTurnFinished();
            clearTimeout(turnSafetyTimer);
            turnSafetyTimer = setTimeout(() => {
              console.warn('[Turn] Safety timeout — forcing idle');
              enterFloorState(FloorState.IDLE);
              sendWsJson({ type: 'playbackComplete', turnSeq: activeTurnSeq });
              resetTurnState();
            }, TURN_SAFETY_TIMEOUT);
          }
          break;

        case 'gesture':
          if (bodyAnim) bodyAnim.triggerGesture(msg.tag);
          break;

        case 'mood':
          baselineMood = msg.state;
          applyMood();
          break;

        case 'error':
          addMessage('Error: ' + msg.message, 'system');
          break;

        case 'partial':
          status.textContent = 'Hearing: ' + msg.text;
          break;
      }
    } else {
      handleAudioFrame(evt.data);
    }
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected — reconnecting...';
    msgInput.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;
    stopRecording();
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    status.textContent = 'Connection error';
  };
}

function sendText() {
  const text = msgInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  const llmModel = document.getElementById('llmModel').value;
  const ttsModel = document.getElementById('ttsModel').value;
  ws.send(JSON.stringify({ type: 'text', text: text, llmModel: llmModel, ttsModel: ttsModel }));
  msgInput.value = '';
  status.textContent = 'Processing...';
  enterFloorState(FloorState.THINKING);
}

var playQueue = [];
var isPlaying = false;

async function handleAudioFrame(blob) {
  try {
    const arrayBuf = await blob.arrayBuffer();
    const header = parseBinaryHeader(arrayBuf);
    const audioBytes = arrayBuf.slice(8);

    if (!audioCtx) audioCtx = new AudioContext();
    const audioBuf = await audioCtx.decodeAudioData(audioBytes);

    if (head) {
      if (header.turnSeq === activeTurnSeq) enterFloorState(FloorState.SPEAKING);

      const key = `${header.turnSeq}:${header.segmentIndex}`;
      const seg = pendingSegments.get(key);
      const r = { audio: audioBuf };

      if (seg && seg.visemes && seg.visemes.length > 0) {
        r.visemes = []; r.vtimes = []; r.vdurations = [];
        for (const v of seg.visemes) {
          r.visemes.push(v.viseme);
          r.vtimes.push(v.startMs);
          r.vdurations.push(v.endMs - v.startMs);
        }
      }

      const markers = [];
      const mtimes = [];
      for (const cue of (seg?.cues || [])) {
        if (cue.type === 'gesture' && bodyAnim) {
          const tag = cue.tag;
          const stroke = bodyAnim.strokeMs(tag);
          const triggerMs = Math.max(0, (cue.offsetMs || 0) - stroke - 150);
          markers.push(() => bodyAnim.triggerGesture(tag));
          mtimes.push(triggerMs);
        }
        if (cue.type === 'mood') {
          const mood = cue.mood;
          markers.push(() => setTurnMood(mood));
          mtimes.push(cue.offsetMs || 0);
        }
      }

      if (header.isFinal) {
        const segIdx = header.segmentIndex;
        markers.push(() => { turnAudioPlayed.add(segIdx); checkTurnFinished(); });
        mtimes.push(audioBuf.duration * 1000);
      }

      if (markers.length > 0) { r.markers = markers; r.mtimes = mtimes; }
      head.speakAudio(r, { isRaw: true });
    } else {
      if (header.turnSeq === activeTurnSeq && !isPlaying && playQueue.length === 0) {
        enterFloorState(FloorState.SPEAKING);
      }
      playQueue.push({ audio: audioBuf, turnSeq: header.turnSeq, segmentIndex: header.segmentIndex, isFinal: header.isFinal });
      if (!isPlaying) playNextQueued();
    }
  } catch (e) {
    console.error('[Audio] Frame error:', e);
  }
}

function playNextQueued() {
  if (playQueue.length === 0) { isPlaying = false; status.textContent = 'Ready'; return; }
  isPlaying = true;
  var item = playQueue.shift();

  if (!audioCtx) audioCtx = new AudioContext();
  var source = audioCtx.createBufferSource();
  source.buffer = item.audio;
  var rate = parseFloat(document.getElementById('speed').value);
  source.playbackRate.value = rate;
  source.connect(audioCtx.destination);
  source.start();
  status.textContent = 'Speaking... (' + playQueue.length + ' queued)';

  source.onended = function() {
    if (item.isFinal) {
      turnAudioPlayed.add(item.segmentIndex);
      checkTurnFinished();
    }
    playNextQueued();
  };
}

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value + 'x';
});

var audioFrameCount = 0;

async function startRecording() {
  if (recording) return;
  console.log('[MIC] startRecording called');
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    console.log('[MIC] AudioContext sampleRate:', audioCtx.sampleRate);
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
    audioFrameCount = 0;
    micProcessor.onaudioprocess = function(e) {
      if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
      var input = e.inputBuffer.getChannelData(0);
      var resampled = resampleTo16k(input, audioCtx.sampleRate);
      var buf = new ArrayBuffer(resampled.length * 4);
      new Float32Array(buf).set(resampled);
      ws.send(buf);
      audioFrameCount++;
    };
    micSource.connect(micProcessor);
    micProcessor.connect(audioCtx.destination);
    var llm = document.getElementById('llmModel').value;
    var tts = document.getElementById('ttsModel').value;
    ws.send(JSON.stringify({ type: 'start', sampleRate: 16000, llmModel: llm, ttsModel: tts }));
    console.log('[MIC] sent START, mic active');
    recording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = 'Recording...';
    status.textContent = 'Listening...';
    enterFloorState(FloorState.LISTENING);
  } catch (e) {
    console.error('[MIC] error:', e);
    addMessage('Microphone error: ' + e.message, 'system');
  }
}

function stopRecording() {
  if (!recording) return;
  console.log('[MIC] stopRecording called, frames sent:', audioFrameCount);
  micBtn.classList.remove('recording');
  micBtn.textContent = 'Finishing...';
  micBtn.disabled = true;
  status.textContent = 'Capturing final audio...';
  setTimeout(function() {
    recording = false;
    console.log('[MIC] sending STOP, total frames:', audioFrameCount);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
    }
    status.textContent = 'Processing speech...';
    enterFloorState(FloorState.THINKING);
    micBtn.textContent = 'Mic';
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
    micBtn.disabled = false;
  }, 500);
}

function resampleTo16k(input, fromRate) {
  if (fromRate === 16000) return input;
  var ratio = fromRate / 16000;
  var len = Math.round(input.length / ratio);
  var out = new Float32Array(len);
  for (var i = 0; i < len; i++) {
    out[i] = input[Math.round(i * ratio)];
  }
  return out;
}

micBtn.addEventListener('click', function() {
  if (recording) { stopRecording(); } else { startRecording(); }
});

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText();
});

let lastTypingActivity = 0;
msgInput.addEventListener('input', function() {
  const now = Date.now();
  if (now - lastTypingActivity > 2000) {
    sendWsJson({ type: 'userActivity', kind: 'TYPING' });
    lastTypingActivity = now;
  }
});

document.addEventListener('visibilitychange', function() {
  sendWsJson({ type: 'userActivity', kind: 'VISIBILITY_CHANGE' });
});

connect();

var modelStatusEl = document.getElementById('model-status');
var ttsSelect = document.getElementById('ttsModel');
var modelPollTimer = null;

function pollModelStatus() {
  fetch('/api/models/status')
    .then(r => r.json())
    .then(data => {
      var total = Object.keys(data).length;
      var ready = 0;
      var downloading = 0;
      var errors = 0;
      for (var key in data) {
        if (data[key] === 'READY') ready++;
        else if (data[key] === 'DOWNLOADING') downloading++;
        else if (data[key] === 'ERROR') errors++;
      }

      for (var i = 0; i < ttsSelect.options.length; i++) {
        var opt = ttsSelect.options[i];
        var st = data[opt.value];
        opt.disabled = st !== 'READY';
        if (st === 'DOWNLOADING') opt.text = opt.text.replace(/ \(downloading\.\.\.\)$/, '') + ' (downloading...)';
        else opt.text = opt.text.replace(/ \(downloading\.\.\.\)$/, '');
      }

      if (ready === total) {
        modelStatusEl.innerHTML = '<span class="ready">All voice models ready</span>';
        clearInterval(modelPollTimer);
        setTimeout(function() { modelStatusEl.style.display = 'none'; }, 3000);
      } else if (downloading > 0) {
        modelStatusEl.innerHTML = '<span class="downloading">Downloading voice models: ' + ready + '/' + total + ' ready</span>';
      } else if (errors > 0) {
        modelStatusEl.innerHTML = '<span class="error">Model errors: ' + errors + '/' + total + '</span>';
        if (ready + errors === total) clearInterval(modelPollTimer);
      }
    })
    .catch(function() {});
}

modelPollTimer = setInterval(pollModelStatus, 2000);
pollModelStatus();

document.getElementById('avatarModel').addEventListener('change', async function() {
  if (!head || !avatarContainer.classList.contains('active')) return;
  try {
    addMessage('Loading avatar...', 'system');
    await head.showAvatar({ url: './' + this.value, body: 'F', avatarMood: 'neutral', lipsyncLang: 'en' });
    addMessage('Avatar loaded.', 'system');
  } catch (e) { addMessage('Avatar load error: ' + e.message, 'system'); }
});

toggleAvatar.addEventListener('click', async function() {
  if (avatarContainer.classList.contains('active')) {
    avatarContainer.classList.remove('active');
    toggleAvatar.textContent = 'Show 3D Avatar';
    return;
  }
  avatarContainer.classList.add('active');
  toggleAvatar.textContent = 'Hide 3D Avatar';
  if (!head) {
    try {
      addMessage('Loading 3D avatar...', 'system');
      head = new TalkingHead(avatarContainer, {
        ttsEndpoint: null,
        lipsyncModules: ['en'],
        cameraView: 'upper',
        cameraRotateEnable: true,
        cameraZoomEnable: true,
        cameraPanEnable: true,
        avatarIdleEyeContact: 0.4,
        avatarIdleHeadMove: 0.6,
        avatarSpeakingEyeContact: 0.7,
        avatarSpeakingHeadMove: 0.7,
        modelMovementFactor: 0.8
      });
      await head.showAvatar({
        url: './avatar.glb',
        body: 'F',
        avatarMood: 'neutral',
        lipsyncLang: 'en'
      });
      window._head = head;
      addMessage('3D avatar ready.', 'system');
      head.setMood('neutral');

      try {
        if (bodyAnim) { bodyAnim.dispose(); bodyAnim = null; }

        var avatarModel = head.armature;
        if (avatarModel) {
          const configResp = await fetch('animations/avatar-performance.json');
          const config = await configResp.json();
          bodyAnim = await BodyAnimationSystem.create(avatarModel, config);

          head.registerMixer(bodyAnim.mixer, {
            boneClaim: [
              'Spine', 'Spine1', 'Spine2', 'Hips',
              'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand',
              'LeftHandThumb1', 'LeftHandThumb2', 'LeftHandThumb3',
              'LeftHandIndex1', 'LeftHandIndex2', 'LeftHandIndex3',
              'LeftHandMiddle1', 'LeftHandMiddle2', 'LeftHandMiddle3',
              'LeftHandRing1', 'LeftHandRing2', 'LeftHandRing3',
              'LeftHandPinky1', 'LeftHandPinky2', 'LeftHandPinky3',
              'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand',
              'RightHandThumb1', 'RightHandThumb2', 'RightHandThumb3',
              'RightHandIndex1', 'RightHandIndex2', 'RightHandIndex3',
              'RightHandMiddle1', 'RightHandMiddle2', 'RightHandMiddle3',
              'RightHandRing1', 'RightHandRing2', 'RightHandRing3',
              'RightHandPinky1', 'RightHandPinky2', 'RightHandPinky3',
              'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'LeftToeBase',
              'RightUpLeg', 'RightLeg', 'RightFoot', 'RightToeBase',
            ],
          });

          head.registerMorphLayer('gestureExpressions', {
            order: 10,
            blend: 'additive',
            update: (dt, get, set) => {
              const exprs = bodyAnim.sampleExpressions();
              if (!exprs) return;
              for (const [name, value] of Object.entries(exprs)) {
                set(name, value);
              }
            }
          });

          addMessage('Body animations loaded (floor state: ' + bodyAnim.floorState + ').', 'system');
        }
      } catch (e) {
        console.warn('Body animation load failed:', e);
        addMessage('Body animations unavailable: ' + e.message, 'system');
      }
    } catch (e) {
      addMessage('Avatar load error: ' + e.message, 'system');
      head = null;
    }
  }
});

document.getElementById('playAnim').addEventListener('click', function() {
  var clipName = document.getElementById('animPicker').value;
  if (clipName && bodyAnim) {
    bodyAnim.triggerGesture(clipName);
    addMessage('Playing: ' + clipName, 'system');
  }
});
</script>
