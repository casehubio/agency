<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Speech Demo</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "./vendor/talkinghead.mjs"
} }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 0.75rem 1rem; text-align: center; border-bottom: 1px solid #333; }
  header h1 { font-size: 1.1rem; font-weight: 500; }
  #controls { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; padding: 0.4rem 1rem; border-bottom: 1px solid #333; align-items: center; justify-content: center; }
  #controls label { font-size: 0.75rem; color: #999; }
  #controls select { padding: 0.25rem 0.4rem; border-radius: 6px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.8rem; }
  #split { flex: 1; display: flex; overflow: hidden; }
  #avatar-panel { width: 50%; min-width: 50%; display: flex; flex-direction: column; border-right: 1px solid #333; background: #111; position: relative; }
  #avatar-container { flex: 1; position: relative; }
  .cam-btns { position: absolute; bottom: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; z-index: 10; }
  .cam-btn { padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid #555; background: rgba(42,42,62,0.8); color: #ccc; font-size: 0.7rem; cursor: pointer; }
  .cam-btn:hover, .cam-btn.active { background: rgba(45,90,160,0.9); color: #fff; border-color: #2d5aa0; }
  #chat-panel { width: 50%; display: flex; flex-direction: column; }
  #status { padding: 0.25rem 1rem; font-size: 0.75rem; color: #666; text-align: center; border-bottom: 1px solid #333; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { max-width: 85%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2d5aa0; }
  .msg.avatar { align-self: flex-start; background: #333; }
  .msg.system { align-self: center; background: transparent; color: #888; font-size: 0.8rem; }
  #input-bar { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #333; }
  #input-bar input { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.95rem; }
  #input-bar input:focus { outline: none; border-color: #2d5aa0; }
  #input-bar button { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; background: #2d5aa0; color: white; font-size: 0.95rem; cursor: pointer; }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }
  #mic { padding: 0.6rem 0.8rem; border-radius: 8px; border: 2px solid #555; background: #2a2a3e; color: #e0e0e0; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
  #mic:disabled { opacity: 0.5; cursor: default; }
  #mic.recording { background: #d64; border-color: #d64; color: white; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
</style>
</head>
<body>
<header><h1>Avatar Speech Pipeline Demo</h1></header>
<div id="controls"></div>
<div id="split">
  <div id="avatar-panel">
    <div id="avatar-container"></div>
    <div class="cam-btns">
      <button class="cam-btn" data-view="full">Full</button>
      <button class="cam-btn active" data-view="upper">Upper</button>
      <button class="cam-btn" data-view="head">Head</button>
      <button class="cam-btn" id="cam-capture">Capture</button>
    </div>
  </div>
  <div id="chat-panel">
    <div id="status">Connecting...</div>
    <div id="chat"></div>
    <div id="input-bar">
      <button id="mic" disabled title="Click to talk">Mic</button>
      <input id="msg" type="text" placeholder="Type a message..." autocomplete="off" disabled>
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>

<script type="module">
import { AvatarEngine, AvatarControls } from './avatar-component.mjs?v=15';

const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const avatarContainer = document.getElementById('avatar-container');

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

const engine = new AvatarEngine(avatarContainer, {
  cameraView: 'upper',
  onMessage: ({ text, role }) => addMessage(text, role),
  onStatus: (msg) => { statusEl.textContent = msg; },
  onConnected: async () => {
    statusEl.textContent = 'Connected';
    msgInput.disabled = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
    try { await engine.initAvatar(); engine.setView('upper'); } catch (e) { console.warn('Avatar load:', e); }
  },
  onDisconnected: () => {
    msgInput.disabled = true;
    sendBtn.disabled = true;
    micBtn.disabled = true;
  }
});

window.__engine = engine;
const controls = new AvatarControls(document.getElementById('controls'), engine);
document.querySelectorAll('.cam-btn[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    engine.setView(btn.dataset.view);
  });
});
document.getElementById('cam-capture').addEventListener('click', () => {
  if (!engine._head || !engine._head.camera || !engine._head.controls) { alert('Avatar not loaded'); return; }
  const cam = engine._head.camera.position;
  const tgt = engine._head.controls.target;
  const h = engine._head.avatarHeight;
  const active = document.querySelector('.cam-btn.active[data-view]');
  const view = active ? active.dataset.view : 'unknown';
  const data = { view, h: +h.toFixed(3), cam: { x: +cam.x.toFixed(3), y: +cam.y.toFixed(3), z: +cam.z.toFixed(3) }, target: { x: +tgt.x.toFixed(3), y: +tgt.y.toFixed(3), z: +tgt.z.toFixed(3) }, panel: { w: document.getElementById('avatar-container').clientWidth, h: document.getElementById('avatar-container').clientHeight } };
  const json = JSON.stringify(data);
  console.log('CAPTURE:', json);
  navigator.clipboard.writeText(json).then(() => {
    document.getElementById('cam-capture').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('cam-capture').textContent = 'Capture'; }, 1500);
  });
});

function sendText() {
  const text = msgInput.value.trim();
  if (!text) return;
  engine.sendText(text, { llmModel: controls.llmModel, ttsModel: controls.ttsModel });
  msgInput.value = '';
  statusEl.textContent = 'Processing...';
}

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });

let recording = false;
let audioCtx = null;
let micStream = null;
let micProcessor = null;
let micSource = null;

async function startRecording() {
  if (recording) return;
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
    micProcessor.onaudioprocess = function(e) {
      if (!recording) return;
      const input = e.inputBuffer.getChannelData(0);
      const resampled = resampleTo16k(input, audioCtx.sampleRate);
      const buf = new ArrayBuffer(resampled.length * 4);
      new Float32Array(buf).set(resampled);
      engine.sendBinary(buf);
    };
    micSource.connect(micProcessor);
    micProcessor.connect(audioCtx.destination);
    engine.startRecording(16000, { llmModel: controls.llmModel, ttsModel: controls.ttsModel });
    recording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = 'Recording...';
    statusEl.textContent = 'Listening...';
  } catch (e) {
    addMessage('Microphone error: ' + e.message, 'system');
  }
}

function stopRecording() {
  if (!recording) return;
  micBtn.classList.remove('recording');
  micBtn.textContent = 'Finishing...';
  micBtn.disabled = true;
  setTimeout(function() {
    recording = false;
    engine.stopRecording();
    statusEl.textContent = 'Processing speech...';
    micBtn.textContent = 'Mic';
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    micBtn.disabled = false;
  }, 500);
}

function resampleTo16k(input, fromRate) {
  if (fromRate === 16000) return input;
  const ratio = fromRate / 16000;
  const len = Math.round(input.length / ratio);
  const out = new Float32Array(len);
  for (let i = 0; i < len; i++) out[i] = input[Math.round(i * ratio)];
  return out;
}

micBtn.addEventListener('click', () => { if (recording) stopRecording(); else startRecording(); });

let lastTypingActivity = 0;
msgInput.addEventListener('input', function() {
  const now = Date.now();
  if (now - lastTypingActivity > 2000) {
    engine.sendJson({ type: 'userActivity', kind: 'TYPING' });
    lastTypingActivity = now;
  }
});

document.addEventListener('visibilitychange', function() {
  engine.sendJson({ type: 'userActivity', kind: 'VISIBILITY_CHANGE' });
});

engine.connect();
</script>
</body>
</html>
