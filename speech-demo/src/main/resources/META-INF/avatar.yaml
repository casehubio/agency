agent: speech-demo
model: claude-haiku-4-5@20251001
tts-voice: kokoro:af_heart
sample-rate: 16000
speed: 0.9
min-playback-rate: 0.6

tts:
  engines:
    - type: kokoro
      voices:
        - af_heart
        - af_nova
        - am_adam
        - bm_fable
    # Qwen3 requires Python + PyTorch inference server — not available in this container
    # - type: qwen3
    #   voices: [ryan, aiden, eric, dylan, serena, vivian]
    #   cloned-voices: true

stt:
  type: whisper-fallback

cleanup:
  max-destructiveness: 1

pipeline:
  post-llm:
    - name: casing
