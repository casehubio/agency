<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">Gesture Timing: Three Layers</text>

  <!-- Timeline axis -->
  <line x1="60" y1="280" x2="680" y2="280" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="370" y="310" text-anchor="middle" font-size="11" fill="#868e96">audio buffer time (ms)</text>

  <!-- Layer 1: TTS Word Onset -->
  <rect x="60" y="50" width="620" height="55" rx="4" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1"/>
  <text x="75" y="68" font-size="11" font-weight="600" fill="#1971c2">Layer 1: TTS Word Onset</text>
  <text x="75" y="84" font-size="10" fill="#495057">TextMark(charOffset) → SynthesisOptions → MarkTiming(offsetMs)</text>
  <rect x="380" y="72" width="6" height="28" rx="2" fill="#1971c2"/>
  <text x="395" y="92" font-size="10" fill="#1971c2" font-weight="500">offsetMs = 1200</text>

  <!-- Layer 2: Stroke Preparation -->
  <rect x="60" y="115" width="620" height="55" rx="4" fill="#fff3bf" stroke="#ffd43b" stroke-width="1"/>
  <text x="75" y="133" font-size="11" font-weight="600" fill="#e67700">Layer 2: Stroke Preparation</text>
  <text x="75" y="149" font-size="10" fill="#495057">avatar-performance.json → strokeMs per clip (shrug: 300ms)</text>
  <rect x="260" y="137" width="120" height="22" rx="3" fill="#fff9db" stroke="#fab005"/>
  <text x="320" y="152" text-anchor="middle" font-size="9" fill="#e67700">strokeMs = 300</text>

  <!-- Layer 3: Crossfade -->
  <rect x="60" y="180" width="620" height="55" rx="4" fill="#f3f0ff" stroke="#b197fc" stroke-width="1"/>
  <text x="75" y="198" font-size="11" font-weight="600" fill="#7048e8">Layer 3: Crossfade Lead</text>
  <text x="75" y="214" font-size="10" fill="#495057">GESTURE_DUCK_DURATION / 2 = 150ms</text>
  <rect x="200" y="202" width="60" height="22" rx="3" fill="#f3f0ff" stroke="#9775fa"/>
  <text x="230" y="217" text-anchor="middle" font-size="9" fill="#7048e8">150ms</text>

  <!-- Result arrow and label -->
  <line x1="200" y1="250" x2="200" y2="275" stroke="#2f9e44" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="268" text-anchor="middle" font-size="10" font-weight="600" fill="#2f9e44">trigger</text>

  <!-- Trigger computation -->
  <rect x="100" y="248" width="250" height="22" rx="3" fill="#ebfbee" stroke="#69db7c"/>
  <text x="225" y="263" text-anchor="middle" font-size="10" fill="#2b8a3e" font-style="italic">max(0, 1200 − 300 − 150) = 750ms</text>

  <!-- Word onset marker -->
  <line x1="380" y1="100" x2="380" y2="275" stroke="#1971c2" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="385" y="272" font-size="9" fill="#1971c2">word onset</text>

  <!-- Trigger marker -->
  <line x1="200" y1="240" x2="200" y2="280" stroke="#2f9e44" stroke-width="2"/>
</svg>
