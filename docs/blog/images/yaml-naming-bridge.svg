<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <linearGradient id="javaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="yamlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- Java world -->
  <rect x="20" y="20" width="220" height="340" rx="12" fill="url(#javaGrad)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Java Records</text>
  <text x="130" y="68" text-anchor="middle" font-size="10" fill="#6b7280">57 spec files</text>

  <text x="40" y="100" font-size="11" fill="#475569" font-family="monospace">failurePolicy</text>
  <text x="40" y="126" font-size="11" fill="#475569" font-family="monospace">convergenceThreshold</text>
  <text x="40" y="152" font-size="11" fill="#475569" font-family="monospace">maxIterations</text>
  <text x="40" y="178" font-size="11" fill="#475569" font-family="monospace">candidateGroups</text>
  <text x="40" y="204" font-size="11" fill="#475569" font-family="monospace">personalityEvolution</text>
  <text x="40" y="230" font-size="11" fill="#6b7280" font-family="monospace" font-style="italic">... 237 more</text>

  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">camelCase</text>
  <text x="130" y="318" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Java convention</text>
  <text x="130" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">242 fields</text>

  <!-- YAML world -->
  <rect x="480" y="20" width="220" height="340" rx="12" fill="url(#yamlGrad)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="590" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">YAML Config</text>
  <text x="590" y="68" text-anchor="middle" font-size="10" fill="#6b7280">what authors write</text>

  <text x="500" y="100" font-size="11" fill="#475569" font-family="monospace">failure-policy</text>
  <text x="500" y="126" font-size="11" fill="#475569" font-family="monospace">convergence-threshold</text>
  <text x="500" y="152" font-size="11" fill="#475569" font-family="monospace">max-iterations</text>
  <text x="500" y="178" font-size="11" fill="#475569" font-family="monospace">candidate-groups</text>
  <text x="500" y="204" font-size="11" fill="#475569" font-family="monospace">personality-evolution</text>
  <text x="500" y="230" font-size="11" fill="#6b7280" font-family="monospace" font-style="italic">... 237 more</text>

  <text x="590" y="300" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">kebab-case</text>
  <text x="590" y="318" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">YAML convention</text>
  <text x="590" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">both accepted</text>

  <!-- Bridge -->
  <rect x="280" y="60" width="160" height="260" rx="10" fill="url(#bridgeGrad)" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">@JsonAlias</text>
  <text x="360" y="108" text-anchor="middle" font-size="10" fill="#6b7280">additive, not renaming</text>

  <!-- Arrows from Java to bridge -->
  <line x1="240" y1="100" x2="280" y2="140" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="240" y1="152" x2="280" y2="175" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="240" y1="204" x2="280" y2="210" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Arrows from YAML to bridge -->
  <line x1="480" y1="100" x2="440" y2="140" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="480" y1="152" x2="440" y2="175" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="480" y1="204" x2="440" y2="210" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Bridge labels -->
  <text x="360" y="148" text-anchor="middle" font-size="10" fill="#166534" font-family="monospace">failurePolicy ✓</text>
  <text x="360" y="166" text-anchor="middle" font-size="10" fill="#166534" font-family="monospace">failure-policy ✓</text>

  <text x="360" y="196" text-anchor="middle" font-size="10" fill="#166534" font-family="monospace">maxIterations ✓</text>
  <text x="360" y="214" text-anchor="middle" font-size="10" fill="#166534" font-family="monospace">max-iterations ✓</text>

  <!-- Special case highlight -->
  <rect x="296" y="234" width="128" height="70" rx="6" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <text x="360" y="252" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">merge case</text>
  <text x="360" y="268" text-anchor="middle" font-size="9" fill="#166534" font-family="monospace">personality ✓</text>
  <text x="360" y="282" text-anchor="middle" font-size="9" fill="#166534" font-family="monospace">personality-evolution ✓</text>
  <text x="360" y="296" text-anchor="middle" font-size="9" fill="#166534" font-family="monospace">personalityEvolution ✓</text>
</svg>
