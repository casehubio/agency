<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #333; }
      .state { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.5; rx: 8; }
      .warn { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.5; rx: 8; }
      .label { font-size: 14px; font-weight: 600; }
      .edge { font-size: 11px; fill: #666; }
      .severity { font-size: 11px; fill: #856404; font-style: italic; }
    </style>
  </defs>

  <!-- IDLE -->
  <rect class="state" x="20" y="70" width="150" height="70"/>
  <text class="label" x="95" y="100" text-anchor="middle">IDLE</text>
  <text class="edge" x="95" y="118" text-anchor="middle">0 open queries</text>

  <!-- AWAITING_RESPONSE -->
  <rect class="state" x="260" y="70" width="150" height="70"/>
  <text class="label" x="335" y="95" text-anchor="middle">AWAITING</text>
  <text class="label" x="335" y="112" text-anchor="middle">RESPONSE</text>
  <text class="severity" x="335" y="132" text-anchor="middle">advisory: INFO</text>

  <!-- OVERLOADED -->
  <rect class="warn" x="500" y="70" width="150" height="70"/>
  <text class="label" x="575" y="100" text-anchor="middle">OVERLOADED</text>
  <text class="severity" x="575" y="118" text-anchor="middle">advisory: WARNING</text>

  <!-- IDLE → AWAITING -->
  <line x1="170" y1="90" x2="258" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="edge" x="214" y="83">QUERY</text>

  <!-- AWAITING → IDLE -->
  <line x1="260" y1="125" x2="172" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="edge" x="214" y="145">RESPONSE</text>

  <!-- AWAITING → OVERLOADED -->
  <line x1="410" y1="90" x2="498" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="edge" x="454" y="83">QUERY</text>

  <!-- OVERLOADED → AWAITING -->
  <line x1="500" y1="125" x2="412" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="edge" x="454" y="145">RESPONSE</text>

  <!-- OVERLOADED self-loop -->
  <path d="M 575 70 C 575 30 620 30 620 70" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="edge" x="597" y="38">QUERY</text>

  <!-- IDLE self-loop -->
  <path d="M 60 70 C 60 30 100 30 100 70" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="edge" x="68" y="38">RESPONSE</text>

  <!-- Title -->
  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#999">request-response protocol — tiered state machine</text>
</svg>
