<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="8" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#ccc" font-size="15" font-weight="600">Status Bar State Machine</text>

  <!-- States as rounded rects with their colours -->
  <!-- Row 1 -->
  <rect x="30" y="50" width="130" height="36" rx="6" fill="rgba(156,163,175,0.15)" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="95" y="73" text-anchor="middle" fill="#9ca3af" font-size="12">○ Connecting</text>

  <rect x="200" y="50" width="110" height="36" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="255" y="73" text-anchor="middle" fill="#4ade80" font-size="12">● Ready</text>

  <rect x="350" y="50" width="130" height="36" rx="6" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="415" y="73" text-anchor="middle" fill="#60a5fa" font-size="12">🎤 Listening</text>

  <rect x="520" y="50" width="170" height="36" rx="6" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="605" y="73" text-anchor="middle" fill="#fbbf24" font-size="12">⏳ Processing</text>

  <!-- Row 2 -->
  <rect x="80" y="140" width="140" height="36" rx="6" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="163" text-anchor="middle" fill="#fbbf24" font-size="12">💭 Thinking</text>

  <rect x="280" y="140" width="140" height="36" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="350" y="163" text-anchor="middle" fill="#4ade80" font-size="12">🔊 Speaking</text>

  <rect x="480" y="140" width="140" height="36" rx="6" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="550" y="163" text-anchor="middle" fill="#4ade80" font-size="12">● Ready</text>

  <!-- Row 3 — error and disconnected -->
  <rect x="80" y="230" width="150" height="36" rx="6" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="1.5"/>
  <text x="155" y="253" text-anchor="middle" fill="#f87171" font-size="12">⚠ Error: {msg}</text>

  <rect x="310" y="230" width="170" height="36" rx="6" fill="rgba(156,163,175,0.15)" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="395" y="253" text-anchor="middle" fill="#9ca3af" font-size="12">○ Reconnecting</text>

  <!-- Arrows: Connecting → Ready -->
  <line x1="160" y1="68" x2="195" y2="68" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Ready → Listening (mic click) -->
  <line x1="310" y1="68" x2="345" y2="68" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="328" y="60" text-anchor="middle" fill="#666" font-size="9">mic</text>
  <!-- Listening → Processing (stop) -->
  <line x1="480" y1="68" x2="515" y2="68" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="498" y="60" text-anchor="middle" fill="#666" font-size="9">stop</text>

  <!-- Ready → Thinking (text send) -->
  <line x1="255" y1="86" x2="150" y2="135" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="185" y="108" text-anchor="middle" fill="#666" font-size="9">text</text>

  <!-- Processing → Thinking -->
  <line x1="590" y1="86" x2="175" y2="135" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Thinking → Speaking (audio arrives) -->
  <line x1="220" y1="158" x2="275" y2="158" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="248" y="150" text-anchor="middle" fill="#666" font-size="9">audio</text>

  <!-- Speaking → Ready (turn done) -->
  <line x1="420" y1="158" x2="475" y2="158" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="448" y="150" text-anchor="middle" fill="#666" font-size="9">done</text>

  <!-- Any → Error -->
  <text x="155" y="215" text-anchor="middle" fill="#666" font-size="9">any error</text>
  <line x1="155" y1="220" x2="155" y2="225" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Any → Disconnected -->
  <text x="395" y="215" text-anchor="middle" fill="#666" font-size="9">ws close</text>
  <line x1="395" y1="220" x2="395" y2="225" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Disconnected → Connecting (reconnect) -->
  <path d="M480,248 Q640,248 640,180 Q640,68 520,68" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="650" y="160" fill="#666" font-size="9">retry</text>

  <!-- Legend -->
  <text x="30" y="305" fill="#666" font-size="10">Colours: green = active/ready, blue = listening, amber = processing, red = error, grey = disconnected</text>
</svg>
