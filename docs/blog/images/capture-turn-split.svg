<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 11px; fill: #666; }
    .box-capture { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
    .box-turn { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
    .box-shared { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
    .box-label { font-size: 11px; font-weight: 600; }
    .field { font-size: 11px; fill: #374151; }
    .divider { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4,3; }
    .flow-label { font-size: 10px; fill: #666; }
  </style>

  <text x="360" y="28" text-anchor="middle" class="title">SpeechSession — Capture/Turn Split</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">Two sides, no shared mutable state. FloorState is the only cross-thread coordination.</text>

  <!-- Capture Side -->
  <rect x="20" y="70" width="310" height="290" class="box-capture"/>
  <text x="175" y="92" text-anchor="middle" class="box-label" fill="#1d4ed8">CAPTURE SIDE</text>
  <text x="175" y="106" text-anchor="middle" class="subtitle">WebSocket inbound thread</text>

  <text x="40" y="132" class="field">STT stream lifecycle</text>
  <text x="40" y="150" class="field">Ring buffer (speaker embedding)</text>
  <text x="40" y="168" class="field">Partial poll thread</text>
  <text x="40" y="186" class="field">Speaker identification</text>
  <text x="40" y="204" class="field">Active LLM/TTS model selection</text>

  <line x1="40" y1="220" x2="310" y2="220" class="divider"/>

  <text x="40" y="242" class="field" font-weight="600">handleStop():</text>
  <text x="40" y="258" class="field">  stop polling → finalResult → close</text>
  <text x="40" y="274" class="field">  → cleanup → Transcript → speaker ID</text>
  <text x="40" y="290" class="field">  → enqueue UserTurn ──────────────▶</text>

  <text x="40" y="318" class="field" font-weight="600">handleText():</text>
  <text x="40" y="334" class="field">  cleanup → Transcript</text>
  <text x="40" y="350" class="field">  → enqueue UserTurn ──────────────▶</text>

  <!-- Turn Side -->
  <rect x="390" y="70" width="310" height="290" class="box-turn"/>
  <text x="545" y="92" text-anchor="middle" class="box-label" fill="#15803d">TURN SIDE</text>
  <text x="545" y="106" text-anchor="middle" class="subtitle">Single virtual thread (TurnExecutor)</text>

  <text x="410" y="132" class="field">Conversation history</text>
  <text x="410" y="150" class="field">Prompt assembly (PromptSection composition)</text>
  <text x="410" y="168" class="field">LLM invocation (streaming / batch)</text>
  <text x="410" y="186" class="field">UtteranceSegmenter → ParsedSegment</text>
  <text x="410" y="204" class="field">TTS synthesis per segment</text>

  <line x1="410" y1="220" x2="680" y2="220" class="divider"/>

  <text x="410" y="242" class="field" font-weight="600">Per turn:</text>
  <text x="410" y="258" class="field">  turnSeq++ → process → Segment msgs</text>
  <text x="410" y="274" class="field">  → TurnComplete(turnSeq, count, origin)</text>
  <text x="410" y="290" class="field">  → FloorState.onTurnComplete(expiry)</text>

  <text x="410" y="318" class="field" font-weight="600">Proactive turns:</text>
  <text x="410" y="334" class="field">  suppress if floor busy</text>
  <text x="410" y="350" class="field">  drop if stale at dequeue</text>

  <!-- FloorState -->
  <rect x="200" y="375" width="320" height="38" class="box-shared"/>
  <text x="360" y="398" text-anchor="middle" class="box-label" fill="#92400e">FloorState — volatile, lock-free</text>

  <!-- Arrows to FloorState -->
  <line x1="175" y1="360" x2="310" y2="380" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="545" y1="360" x2="420" y2="380" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="220" y="372" class="flow-label">onStart, onStop, onPlayback</text>
  <text x="445" y="372" class="flow-label">onTurnComplete, onTurnEnd</text>
</svg>
