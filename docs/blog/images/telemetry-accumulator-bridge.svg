<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arw-grn" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">The Accumulator Bridge — Direct Consumer, Dual Interface</text>

  <!-- Agency Layer -->
  <rect x="30" y="55" width="290" height="240" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="175" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Agency (Coordination Topology)</text>

  <rect x="50" y="90" width="250" height="32" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="175" y="111" text-anchor="middle" font-size="11" fill="#713f12">AgentDecisionLoop</text>

  <line x1="175" y1="122" x2="175" y2="142" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="50" y="145" width="250" height="32" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="175" y="166" text-anchor="middle" font-size="11" fill="#713f12">ReasoningCompleted(tokens, latencyMs)</text>

  <line x1="175" y1="177" x2="175" y2="197" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="50" y="200" width="250" height="32" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="175" y="221" text-anchor="middle" font-size="11" fill="#713f12">loopEventSink.accept(event)</text>

  <text x="175" y="260" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Consumer&lt;DecisionLoopEvent&gt;</text>

  <!-- Accumulator (Bridge) -->
  <rect x="260" y="170" width="200" height="90" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">LlmTelemetry</text>
  <text x="360" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Accumulator</text>
  <text x="360" y="232" text-anchor="middle" font-size="9" fill="#15803d">implements Consumer&lt;DecisionLoopEvent&gt;</text>
  <text x="360" y="248" text-anchor="middle" font-size="9" fill="#15803d">implements AgentLlmStatsProvider</text>

  <!-- Arrow from loopEventSink to accumulator -->
  <line x1="300" y1="216" x2="258" y2="216" stroke="#16a34a" stroke-width="2" marker-start="url(#arw-grn)"/>

  <!-- Engine Layer -->
  <rect x="400" y="55" width="290" height="240" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="545" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Engine (Runtime)</text>

  <rect x="420" y="90" width="250" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="545" y="111" text-anchor="middle" font-size="11" fill="#1e3a5f">SwarmTelemetryCollector</text>

  <line x1="545" y1="122" x2="545" y2="142" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="420" y="145" width="250" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="545" y="166" text-anchor="middle" font-size="11" fill="#1e3a5f">provider.getStats(caseId, agentId)</text>

  <line x1="545" y1="177" x2="545" y2="197" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="420" y="200" width="250" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="545" y="221" text-anchor="middle" font-size="11" fill="#1e3a5f">SwarmTelemetry(invocations, tokens, latency)</text>

  <text x="545" y="260" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">AgentLlmStatsProvider SPI</text>

  <!-- Arrow from accumulator to engine -->
  <line x1="462" y1="216" x2="418" y2="216" stroke="#16a34a" stroke-width="2" marker-start="url(#arw-grn)"/>

  <!-- Footer -->
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#94a3b8">Same object instance serves both roles — receives events from the topology, provides stats to the collector</text>
</svg>
