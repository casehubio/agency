<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arw-grn" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">The Accumulator Bridge — Direct Consumer, Dual Interface</text>

  <!-- Agency Layer (left) -->
  <rect x="25" y="55" width="240" height="250" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="145" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Agency Layer</text>
  <text x="145" y="93" text-anchor="middle" font-size="10" fill="#92400e">(Coordination Topology)</text>

  <rect x="40" y="110" width="210" height="30" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="145" y="130" text-anchor="middle" font-size="11" fill="#713f12">AgentDecisionLoop</text>

  <line x1="145" y1="140" x2="145" y2="160" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="40" y="162" width="210" height="30" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="145" y="182" text-anchor="middle" font-size="10" fill="#713f12">ReasoningCompleted</text>

  <line x1="145" y1="192" x2="145" y2="212" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="40" y="214" width="210" height="30" rx="4" fill="#fef9c3" stroke="#facc15"/>
  <text x="145" y="234" text-anchor="middle" font-size="10" fill="#713f12">loopEventSink.accept(event)</text>

  <text x="145" y="274" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">Consumer&lt;DecisionLoopEvent&gt;</text>

  <!-- Accumulator (center) -->
  <rect x="300" y="130" width="220" height="120" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  <text x="410" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">LlmTelemetry</text>
  <text x="410" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Accumulator</text>
  <line x1="330" y1="192" x2="490" y2="192" stroke="#86efac" stroke-width="1"/>
  <text x="410" y="210" text-anchor="middle" font-size="9" fill="#15803d">Consumer&lt;DecisionLoopEvent&gt;</text>
  <text x="410" y="225" text-anchor="middle" font-size="9" fill="#15803d">AgentLlmStatsProvider</text>

  <!-- Arrow: agency → accumulator -->
  <line x1="265" y1="229" x2="298" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arw-grn)"/>
  <text x="272" y="198" font-size="9" fill="#16a34a" font-weight="600">events</text>

  <!-- Arrow: accumulator → engine -->
  <line x1="522" y1="200" x2="554" y2="229" stroke="#16a34a" stroke-width="2" marker-end="url(#arw-grn)"/>
  <text x="530" y="198" font-size="9" fill="#16a34a" font-weight="600">stats</text>

  <!-- Engine Layer (right) -->
  <rect x="555" y="55" width="240" height="250" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="675" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Engine Layer</text>
  <text x="675" y="93" text-anchor="middle" font-size="10" fill="#1e40af">(Runtime)</text>

  <rect x="570" y="110" width="210" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="675" y="130" text-anchor="middle" font-size="11" fill="#1e3a5f">SwarmTelemetryCollector</text>

  <line x1="675" y1="140" x2="675" y2="160" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="570" y="162" width="210" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="675" y="182" text-anchor="middle" font-size="10" fill="#1e3a5f">provider.getStats(caseId, agentId)</text>

  <line x1="675" y1="192" x2="675" y2="212" stroke="#64748b" marker-end="url(#arw)"/>

  <rect x="570" y="214" width="210" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="675" y="234" text-anchor="middle" font-size="10" fill="#1e3a5f">SwarmTelemetry(…real values…)</text>

  <text x="675" y="274" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">AgentLlmStatsProvider SPI</text>

  <!-- Footer -->
  <text x="410" y="345" text-anchor="middle" font-size="10" fill="#94a3b8">Same object instance serves both roles — receives events from the topology,</text>
  <text x="410" y="360" text-anchor="middle" font-size="10" fill="#94a3b8">provides stats to the collector</text>
</svg>
