<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- States -->
  <rect x="30" y="100" width="120" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="130" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">LISTENING</text>

  <rect x="200" y="30" width="160" height="50" rx="25" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="55" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">ENDPOINT_DETECTED</text>

  <rect x="420" y="100" width="140" height="50" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="130" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">PROCESSING</text>

  <rect x="420" y="200" width="140" height="50" rx="25" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="490" y="230" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">PLAYBACK</text>

  <!-- Normal flow -->
  <path d="M 150 110 Q 180 55 200 55" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="155" y="70" font-size="10" fill="#64748b">silence detected</text>

  <path d="M 360 55 Q 400 55 420 100" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="65" font-size="10" fill="#64748b">auto-send</text>

  <line x1="490" y1="150" x2="490" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="180" font-size="10" fill="#64748b">LLM done</text>

  <path d="M 420 225 Q 200 260 90 150" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="250" font-size="10" fill="#64748b">playback complete</text>

  <!-- Interrupt paths (red) -->
  <path d="M 420 120 Q 250 150 150 130" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="250" y="155" font-size="10" font-weight="500" fill="#dc2626">interrupt (new speech)</text>

  <path d="M 420 215 Q 300 200 150 135" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="265" y="205" font-size="10" font-weight="500" fill="#dc2626">interrupt (new speech)</text>
</svg>
