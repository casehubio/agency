<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">TalkingHead animate() frame order</text>

  <!-- Before column -->
  <text x="185" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#c44">Before fork</text>
  <rect x="40" y="65" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="84" text-anchor="middle" fill="#555">1. updatePoseBase — all bones</text>

  <line x1="185" y1="95" x2="185" y2="105" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="105" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="124" text-anchor="middle" fill="#555">2. mixer.update (FBX)</text>

  <line x1="185" y1="135" x2="185" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="145" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="164" text-anchor="middle" fill="#555">3. updatePoseDelta — all bones</text>

  <line x1="185" y1="175" x2="185" y2="185" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="185" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="204" text-anchor="middle" fill="#555">4. neck + hips direct writes</text>

  <line x1="185" y1="215" x2="185" y2="225" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="225" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="244" text-anchor="middle" fill="#555">5. dynamicbones</text>

  <line x1="185" y1="255" x2="185" y2="265" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="265" width="290" height="30" rx="4" fill="#f5d0d0" stroke="#c44"/>
  <text x="185" y="284" text-anchor="middle" fill="#933">6. opt.update(dt) ← your hook</text>

  <line x1="185" y1="295" x2="185" y2="305" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="305" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="324" text-anchor="middle" fill="#555">7. updateMorphTargets — all morphs</text>

  <line x1="185" y1="335" x2="185" y2="345" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="40" y="345" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="185" y="364" text-anchor="middle" fill="#555">8. render()</text>

  <!-- Annotations -->
  <text x="45" y="400" font-size="11" fill="#933">Bones overwritten before hook. Morphs overwritten after.</text>

  <!-- After column -->
  <text x="570" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#2a7">After fork</text>
  <rect x="425" y="65" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="84" text-anchor="middle" fill="#555">1. updatePoseBase — unclaimed only</text>

  <line x1="570" y1="95" x2="570" y2="105" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="105" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="124" text-anchor="middle" fill="#555">2. mixer.update (FBX)</text>

  <line x1="570" y1="135" x2="570" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="145" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="164" text-anchor="middle" fill="#555">3. updatePoseDelta — unclaimed only</text>

  <line x1="570" y1="175" x2="570" y2="185" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="185" width="290" height="30" rx="4" fill="#d0e8d0" stroke="#2a7"/>
  <text x="570" y="204" text-anchor="middle" fill="#186">4. neck/hips — guarded by claims</text>

  <line x1="570" y1="215" x2="570" y2="225" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="225" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="244" text-anchor="middle" fill="#555">5. dynamicbones</text>

  <line x1="570" y1="255" x2="570" y2="265" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="265" width="290" height="30" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="284" text-anchor="middle" fill="#555">6. opt.update(dt)</text>

  <line x1="570" y1="295" x2="570" y2="305" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="305" width="290" height="30" rx="4" fill="#d0e8d0" stroke="#2a7"/>
  <text x="570" y="324" text-anchor="middle" fill="#186">7. registered mixers → claimed bones</text>

  <line x1="570" y1="335" x2="570" y2="345" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="345" width="290" height="22" rx="4" fill="#e8e8e8" stroke="#bbb"/>
  <text x="570" y="360" text-anchor="middle" fill="#555" font-size="11">8. updateMorphTargets (layer 0)</text>

  <line x1="570" y1="367" x2="570" y2="373" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="425" y="373" width="290" height="22" rx="4" fill="#d0e8d0" stroke="#2a7"/>
  <text x="570" y="388" text-anchor="middle" fill="#186" font-size="11">9. registered morph layers (1..N)</text>

  <line x1="570" y1="395" x2="570" y2="398" stroke="#666" marker-end="url(#arrow)"/>
  <text x="570" y="412" text-anchor="middle" fill="#555" font-size="11">10. render()</text>

  <text x="430" y="412" font-size="11" fill="#186" visibility="hidden">Clean ownership at every step.</text>
</svg>
