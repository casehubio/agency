<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Speech Pipeline — Three Insertion Points</text>

  <!-- Main pipeline boxes -->
  <rect x="30" y="60" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="75" y="86" text-anchor="middle" font-weight="500" fill="#1a73e8">STT</text>

  <rect x="200" y="60" width="120" height="44" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="260" y="86" text-anchor="middle" font-weight="500" fill="#c5221f">post-stt</text>

  <rect x="390" y="60" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="435" y="86" text-anchor="middle" font-weight="500" fill="#1a73e8">LLM</text>

  <rect x="30" y="160" width="120" height="44" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="90" y="186" text-anchor="middle" font-weight="500" fill="#c5221f">post-llm</text>

  <rect x="220" y="160" width="120" height="44" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="280" y="186" text-anchor="middle" font-weight="500" fill="#1a73e8">Segmenter</text>

  <rect x="410" y="160" width="140" height="44" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="480" y="186" text-anchor="middle" font-weight="500" fill="#c5221f">post-segmenter</text>

  <rect x="310" y="260" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="355" y="286" text-anchor="middle" font-weight="500" fill="#1a73e8">TTS</text>

  <rect x="480" y="260" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="525" y="286" text-anchor="middle" font-weight="500" fill="#1a73e8">Lip Sync</text>

  <rect x="620" y="260" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="660" y="286" text-anchor="middle" font-weight="500" fill="#0d652d">Audio</text>

  <!-- Arrows -->
  <line x1="120" y1="82" x2="195" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="82" x2="385" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480,82 Q540,82 540,120 Q540,160 500,170" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="500" y1="170" x2="555" y2="182" stroke="#555" stroke-width="0" />
  <line x1="435" y1="104" x2="435" y2="130" stroke="#555" stroke-width="1.5"/>
  <text x="445" y="128" font-size="11" fill="#888">per sentence</text>
  <line x1="435" y1="136" x2="90" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="150" y1="182" x2="215" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="182" x2="405" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="204" x2="355" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="282" x2="475" y2="282" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="282" x2="615" y2="282" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Granularity labels -->
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#888" font-style="italic">per turn</text>
  <text x="90" y="218" text-anchor="middle" font-size="11" fill="#888" font-style="italic">per sentence (streaming)</text>
  <text x="480" y="218" text-anchor="middle" font-size="11" fill="#888" font-style="italic">per segment</text>

  <!-- Legend -->
  <rect x="30" y="280" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="48" y="291" font-size="11" fill="#555">Built-in stage</text>
  <rect x="130" y="280" width="12" height="12" rx="2" fill="#fce8e6" stroke="#ea4335"/>
  <text x="148" y="291" font-size="11" fill="#555">User-extensible</text>
</svg>
