<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" fill="#fafafa" rx="8"/>

  <!-- CLOSED state -->
  <rect x="40" y="110" width="160" height="80" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-weight="bold" fill="#1b5e20" font-size="16">CLOSED</text>
  <text x="120" y="168" text-anchor="middle" fill="#2e7d32" font-size="11">tracking breaches</text>
  <text x="120" y="182" text-anchor="middle" fill="#2e7d32" font-size="11">shouldDegrade → false</text>

  <!-- OPEN state -->
  <rect x="280" y="110" width="160" height="80" rx="12" fill="#ffebee" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="145" text-anchor="middle" font-weight="bold" fill="#b71c1c" font-size="16">OPEN</text>
  <text x="360" y="168" text-anchor="middle" fill="#c62828" font-size="11">heuristic fallback</text>
  <text x="360" y="182" text-anchor="middle" fill="#c62828" font-size="11">shouldDegrade → true</text>

  <!-- HALF_OPEN state -->
  <rect x="520" y="110" width="160" height="80" rx="12" fill="#fff3e0" stroke="#e67e22" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-weight="bold" fill="#e65100" font-size="16">HALF_OPEN</text>
  <text x="600" y="168" text-anchor="middle" fill="#ef6c00" font-size="11">recovery probing</text>
  <text x="600" y="182" text-anchor="middle" fill="#ef6c00" font-size="11">shouldDegrade → false</text>

  <!-- CLOSED → OPEN -->
  <line x1="200" y1="140" x2="275" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="237" y="130" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">breaches ≥ N</text>

  <!-- OPEN → HALF_OPEN -->
  <line x1="440" y1="140" x2="515" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="477" y="130" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">timeout</text>

  <!-- HALF_OPEN → CLOSED -->
  <path d="M 600 190 C 600 270, 120 270, 120 190" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="360" y="260" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">probes succeed</text>

  <!-- HALF_OPEN → OPEN (probe failure) -->
  <path d="M 530 190 C 490 230, 420 230, 430 190" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="480" y="228" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">probe fails</text>

  <!-- Title -->
  <text x="360" y="35" text-anchor="middle" font-weight="bold" fill="#333" font-size="15">LatencyDegradationTrigger — Circuit Breaker State Machine</text>

  <!-- Legend -->
  <text x="40" y="310" fill="#888" font-size="10">External state supplier composes via most-restrictive-wins: OPEN > HALF_OPEN > CLOSED</text>
</svg>
