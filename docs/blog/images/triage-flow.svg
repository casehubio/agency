<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Recovery Chain: Structural → Intelligent Triage</text>

  <!-- Step failure box -->
  <rect x="260" y="50" width="200" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="360" y="77" text-anchor="middle" font-size="13" font-weight="500" fill="#991b1b">Step Failure</text>

  <!-- Arrow down -->
  <line x1="360" y1="94" x2="360" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Structural recovery box -->
  <rect x="210" y="120" width="300" height="80" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">Structural Recovery</text>
  <text x="360" y="168" text-anchor="middle" font-size="11" fill="#475569">TRANSIENT → REASONING → FUNDAMENTAL</text>
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#64748b">Retry counts, backoff, context refresh</text>

  <!-- Arrow right: recovered -->
  <line x1="510" y1="160" x2="580" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="580" y="142" width="120" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="640" y="165" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">Recovered ✓</text>

  <!-- Arrow down: exhausted -->
  <line x1="360" y1="200" x2="360" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="375" y="225" font-size="10" fill="#dc2626" font-style="italic">exhausted</text>

  <!-- Triage box (the new bit) -->
  <rect x="190" y="240" width="340" height="100" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <text x="360" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">LLM Triage</text>
  <text x="360" y="290" text-anchor="middle" font-size="11" fill="#475569">TriageContext → LLM analysis → TriageDecision</text>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#64748b">Failure detail, execution context, attempt history</text>
  <text x="360" y="326" text-anchor="middle" font-size="11" fill="#64748b">Domain-agnostic — the LLM interprets the context</text>

  <!-- Arrow left: retry with modifications -->
  <path d="M190,290 L100,290 L100,160 L210,160" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>
  <text x="60" y="228" font-size="11" fill="#16a34a" font-weight="500" transform="rotate(-90,60,228)">Retry(mods)</text>

  <!-- Arrow down: abandon -->
  <line x1="360" y1="340" x2="360" y2="380" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Abandon box -->
  <rect x="260" y="380" width="200" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="360" y="407" text-anchor="middle" font-size="13" font-weight="500" fill="#991b1b">Abandon(reason)</text>

  <!-- Legend -->
  <rect x="20" y="450" width="680" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="475" r="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="64" y="479" font-size="11" fill="#475569">Mechanical (engine)</text>
  <circle cx="230" cy="475" r="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="244" y="479" font-size="11" fill="#475569">Intelligent (agency)</text>
  <line x1="400" y1="475" x2="430" y2="475" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="438" y="479" font-size="11" fill="#475569">Retry loop</text>
  <line x1="550" y1="475" x2="580" y2="475" stroke="#dc2626" stroke-width="1.5"/>
  <text x="588" y="479" font-size="11" fill="#475569">Failure path</text>
</svg>
