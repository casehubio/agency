<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="connGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="agencyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Connectors region -->
  <rect x="20" y="20" width="640" height="160" rx="12" fill="url(#connGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="40" y="48" font-size="13" font-weight="600" fill="#3b82f6">connectors (mechanical)</text>

  <!-- voice-spi -->
  <rect x="50" y="65" width="260" height="45" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="83" font-size="11" fill="#64748b" text-anchor="middle">voice-spi</text>
  <text x="180" y="99" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">EndpointDetectionPolicy → EndpointAction</text>

  <rect x="50" y="125" width="260" height="45" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="143" font-size="11" fill="#64748b" text-anchor="middle">voice-spi</text>
  <text x="180" y="159" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">RecognitionStream.reset() / segmentResult()</text>

  <!-- voice-sherpa -->
  <rect x="370" y="65" width="270" height="105" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="505" y="83" font-size="11" fill="#64748b" text-anchor="middle">voice-sherpa</text>
  <text x="505" y="102" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">SherpaEndpointDetectionPolicy</text>
  <text x="505" y="122" font-size="11" fill="#64748b" text-anchor="middle">delegates to isEndpointDetected()</text>
  <text x="505" y="145" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">SherpaConfig.silenceThresholds</text>

  <!-- Arrow from SPI to sherpa -->
  <line x1="310" y1="88" x2="370" y2="88" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker></defs>

  <!-- Agency region -->
  <rect x="20" y="210" width="640" height="190" rx="12" fill="url(#agencyGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="40" y="238" font-size="13" font-weight="600" fill="#8b5cf6">agency (LLM integration)</text>

  <!-- speech-ws -->
  <rect x="50" y="255" width="300" height="130" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="200" y="273" font-size="11" fill="#64748b" text-anchor="middle">speech-ws</text>
  <text x="200" y="295" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">SpeechSession polling loop</text>
  <text x="200" y="315" font-size="11" fill="#64748b" text-anchor="middle">endpoint → segmentResult → TurnExecutor</text>
  <text x="200" y="338" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">TurnExecutor.cancelCurrentTurn()</text>
  <text x="200" y="358" font-size="11" fill="#64748b" text-anchor="middle">async Future + volatile cancellation flag</text>
  <text x="200" y="375" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">VoiceState + canned responses</text>

  <!-- avatar-yaml -->
  <rect x="400" y="255" width="240" height="130" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="520" y="273" font-size="11" fill="#64748b" text-anchor="middle">avatar-yaml</text>
  <text x="520" y="295" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">SttSpec</text>
  <text x="520" y="315" font-size="11" fill="#64748b" text-anchor="middle">endpoint-detection:</text>
  <text x="520" y="333" font-size="11" fill="#64748b" text-anchor="middle">  silence-threshold-ms: 1200</text>
  <text x="520" y="351" font-size="11" fill="#64748b" text-anchor="middle">interrupt:</text>
  <text x="520" y="369" font-size="11" fill="#64748b" text-anchor="middle">  canned-responses: [...]</text>

  <!-- Vertical arrow from connectors to agency -->
  <line x1="180" y1="170" x2="180" y2="255" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <defs><marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
  <text x="190" y="216" font-size="10" fill="#94a3b8">evaluates</text>
</svg>
