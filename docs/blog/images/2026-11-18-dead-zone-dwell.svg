<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" fill="#fafafa" rx="4"/>

  <!-- Dead zone fill -->
  <rect x="80" y="180" width="600" height="90" fill="#fff3e0" opacity="0.5"/>

  <!-- Axes -->
  <line x1="80" y1="270" x2="680" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="80" y1="270" x2="80" y2="30" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Axis labels -->
  <text x="690" y="274" fill="#666" font-size="11">time</text>
  <text x="40" y="30" fill="#666" font-size="11">|PAD|</text>

  <!-- Dead zone threshold line -->
  <line x1="80" y1="180" x2="680" y2="180" stroke="#e65100" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="10" y="184" fill="#e65100" font-size="10" font-weight="600">0.25</text>
  <text x="585" y="175" fill="#e65100" font-size="10">dead zone</text>

  <!-- Hysteresis threshold line -->
  <line x1="80" y1="156" x2="680" y2="156" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="10" y="160" fill="#1565c0" font-size="10" font-weight="600">0.35</text>
  <text x="585" y="151" fill="#1565c0" font-size="10">+hysteresis</text>

  <!-- Affect magnitude signal (oscillating near dead zone boundary) -->
  <polyline
    points="100,100 140,110 180,130 210,160 230,190 250,170 270,200 290,210 310,230 340,220 360,240 390,250 420,195 440,170 460,140 490,110 520,100"
    fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Dwell timer bracket (before fix — immediate clear) -->
  <line x1="230" y1="275" x2="230" y2="285" stroke="#c62828" stroke-width="1.5"/>
  <line x1="230" y1="285" x2="310" y2="285" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="233" y="299" fill="#c62828" font-size="9" font-style="italic">before: mood cleared here</text>

  <!-- Dwell timer bracket (after fix — holds for 5s) -->
  <rect x="230" y="275" width="190" height="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3" opacity="0.7"/>
  <text x="260" y="288" fill="#2e7d32" font-size="9" font-weight="600">after: 5s dwell holds mood</text>

  <!-- Mood state annotations -->
  <rect x="100" y="50" width="110" height="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="115" y="64" fill="#1565c0" font-size="10" font-weight="600">mood: exuberant</text>

  <rect x="420" y="50" width="110" height="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="435" y="64" fill="#1565c0" font-size="10" font-weight="600">mood: exuberant</text>

  <!-- Arrow showing re-adoption -->
  <path d="M 265 80 C 265 40 420 40 420 60" fill="none" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="295" y="40" fill="#1565c0" font-size="9">re-enters non-dead-zone → resets timer</text>

  <!-- Signal label -->
  <text x="85" y="95" fill="#2e7d32" font-size="10" font-weight="600">affect magnitude</text>

  <!-- Legend -->
  <rect x="80" y="310" width="8" height="3" fill="#fff3e0" stroke="#e65100" stroke-width="0.5"/>
  <text x="92" y="314" fill="#666" font-size="9">dead zone (|PAD| &lt; 0.25)</text>
</svg>
