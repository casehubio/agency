<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Left: Gson (before) -->
  <rect x="20" y="20" width="310" height="280" rx="8" fill="#fff5f5" stroke="#e8c4c4" stroke-width="1.5"/>
  <text x="175" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#c53030">Before: Gson hand-written codec</text>

  <rect x="40" y="68" width="270" height="40" rx="4" fill="#fff" stroke="#e8c4c4"/>
  <text x="175" y="92" text-anchor="middle" font-size="12" fill="#444">encode(): 14-branch switch → JsonObject</text>

  <rect x="40" y="118" width="270" height="40" rx="4" fill="#fff" stroke="#e8c4c4"/>
  <text x="175" y="142" text-anchor="middle" font-size="12" fill="#444">decode(): 6-branch switch → manual parse</text>

  <rect x="40" y="168" width="270" height="40" rx="4" fill="#fff" stroke="#e8c4c4"/>
  <text x="175" y="192" text-anchor="middle" font-size="12" fill="#444">Type names: hardcoded strings</text>

  <rect x="40" y="218" width="270" height="40" rx="4" fill="#fff" stroke="#e8c4c4"/>
  <text x="175" y="242" text-anchor="middle" font-size="12" fill="#444">Field names: hardcoded strings</text>

  <text x="175" y="280" text-anchor="middle" font-size="11" fill="#c53030">camelCase only — no aliases possible</text>

  <!-- Right: Jackson (after) -->
  <rect x="390" y="20" width="310" height="280" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/>
  <text x="545" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#276749">After: Jackson annotations</text>

  <rect x="410" y="68" width="270" height="40" rx="4" fill="#fff" stroke="#9ae6b4"/>
  <text x="545" y="92" text-anchor="middle" font-size="12" fill="#444">encode(): ObjectMapper.writeValueAsString()</text>

  <rect x="410" y="118" width="270" height="40" rx="4" fill="#fff" stroke="#9ae6b4"/>
  <text x="545" y="142" text-anchor="middle" font-size="12" fill="#444">decode(): ObjectMapper.readValue() + validate</text>

  <rect x="410" y="168" width="270" height="40" rx="4" fill="#fff" stroke="#9ae6b4"/>
  <text x="545" y="192" text-anchor="middle" font-size="12" fill="#444">Type names: @JsonSubTypes(names={…})</text>

  <rect x="410" y="218" width="270" height="40" rx="4" fill="#fff" stroke="#9ae6b4"/>
  <text x="545" y="242" text-anchor="middle" font-size="12" fill="#444">Field names: @JsonAlias("kebab-case")</text>

  <text x="545" y="280" text-anchor="middle" font-size="11" fill="#276749">camelCase canonical + kebab-case aliases</text>

  <!-- Arrow -->
  <line x1="335" y1="160" x2="385" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
