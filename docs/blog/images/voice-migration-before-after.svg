<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="420" fill="#fafafa" rx="8"/>

  <!-- BEFORE section -->
  <text x="210" y="30" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Before</text>

  <!-- Agency repo box -->
  <rect x="30" y="45" width="360" height="170" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="67" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">agency</text>

  <!-- speech-api -->
  <rect x="45" y="80" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="95" y="101" font-size="10" fill="#1e40af" text-anchor="middle">speech-api</text>
  <text x="95" y="115" font-size="8" fill="#3b82f6" text-anchor="middle">SPIs + cognitive</text>

  <!-- speech-sherpa -->
  <rect x="160" y="80" width="110" height="50" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="215" y="101" font-size="10" fill="#991b1b" text-anchor="middle">speech-sherpa</text>
  <text x="215" y="115" font-size="8" fill="#ef4444" text-anchor="middle">70 impls + 63 tests</text>

  <!-- native modules -->
  <rect x="285" y="80" width="90" height="50" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="330" y="101" font-size="10" fill="#991b1b" text-anchor="middle">native-*</text>
  <text x="330" y="115" font-size="8" fill="#ef4444" text-anchor="middle">5 platform JARs</text>

  <!-- speech-ws -->
  <rect x="45" y="145" width="100" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="95" y="166" font-size="10" fill="#3730a3" text-anchor="middle">speech-ws</text>
  <text x="95" y="180" font-size="8" fill="#6366f1" text-anchor="middle">avatar endpoint</text>

  <!-- speech-demo -->
  <rect x="160" y="145" width="110" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="215" y="166" font-size="10" fill="#3730a3" text-anchor="middle">speech-demo</text>
  <text x="215" y="180" font-size="8" fill="#6366f1" text-anchor="middle">demo app</text>

  <!-- Connectors repo box (before - thin) -->
  <rect x="30" y="240" width="360" height="100" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="262" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">connectors</text>

  <!-- voice-spi -->
  <rect x="45" y="275" width="100" height="45" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="95" y="296" font-size="10" fill="#166534" text-anchor="middle">voice-spi</text>
  <text x="95" y="308" font-size="8" fill="#22c55e" text-anchor="middle">22 interfaces</text>

  <!-- voice-ref -->
  <rect x="160" y="275" width="100" height="45" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="210" y="296" font-size="10" fill="#166534" text-anchor="middle">voice-ref</text>
  <text x="210" y="308" font-size="8" fill="#22c55e" text-anchor="middle">test stub</text>

  <!-- Anomaly callout -->
  <text x="210" y="370" font-size="11" fill="#dc2626" text-anchor="middle" font-style="italic">SPI in connectors, implementations in agency</text>

  <!-- Divider -->
  <line x1="430" y1="15" x2="430" y2="405" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- AFTER section -->
  <text x="645" y="30" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">After</text>

  <!-- Agency repo box (after - smaller) -->
  <rect x="465" y="45" width="360" height="105" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="645" y="67" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">agency (consumer only)</text>

  <!-- speech-api (cognitive only) -->
  <rect x="480" y="80" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="530" y="101" font-size="10" fill="#1e40af" text-anchor="middle">speech-api</text>
  <text x="530" y="115" font-size="8" fill="#3b82f6" text-anchor="middle">cognitive only</text>

  <!-- speech-ws -->
  <rect x="595" y="80" width="100" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="645" y="101" font-size="10" fill="#3730a3" text-anchor="middle">speech-ws</text>
  <text x="645" y="115" font-size="8" fill="#6366f1" text-anchor="middle">avatar endpoint</text>

  <!-- speech-demo -->
  <rect x="710" y="80" width="100" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="760" y="101" font-size="10" fill="#3730a3" text-anchor="middle">speech-demo</text>
  <text x="760" y="115" font-size="8" fill="#6366f1" text-anchor="middle">demo app</text>

  <!-- Connectors repo box (after - larger) -->
  <rect x="465" y="175" width="360" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="645" y="197" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">connectors (SPI + implementations)</text>

  <!-- voice-spi (enriched) -->
  <rect x="480" y="210" width="100" height="50" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="530" y="231" font-size="10" fill="#166534" text-anchor="middle">voice-spi</text>
  <text x="530" y="245" font-size="8" fill="#22c55e" text-anchor="middle">28 interfaces</text>

  <!-- voice-sherpa -->
  <rect x="595" y="210" width="110" height="50" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="231" font-size="10" fill="#166534" text-anchor="middle">voice-sherpa</text>
  <text x="650" y="245" font-size="8" fill="#16a34a" text-anchor="middle">70 impls + 63 tests</text>

  <!-- voice-ref -->
  <rect x="720" y="210" width="90" height="50" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="765" y="231" font-size="10" fill="#166534" text-anchor="middle">voice-ref</text>
  <text x="765" y="245" font-size="8" fill="#22c55e" text-anchor="middle">test stub</text>

  <!-- native modules -->
  <rect x="480" y="275" width="230" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="300" font-size="10" fill="#166534" text-anchor="middle">voice-sherpa-native-* (5 platform JARs)</text>

  <!-- voice-pipeline-steps -->
  <rect x="480" y="330" width="150" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="555" y="355" font-size="10" fill="#166534" text-anchor="middle">voice-pipeline-steps</text>

  <!-- Arrow from agency to connectors -->
  <path d="M 645 155 L 645 170" stroke="#6366f1" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="665" y="166" font-size="8" fill="#6366f1">depends on</text>

  <!-- Result callout -->
  <text x="645" y="403" font-size="11" fill="#16a34a" text-anchor="middle" font-style="italic">SPI and implementations together — same as every other connector</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
