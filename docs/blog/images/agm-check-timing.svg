<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">AGM Revision: Where to Check Consistency</text>

  <!-- BEFORE section -->
  <rect x="20" y="50" width="330" height="270" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="185" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">BEFORE revision (fixed)</text>

  <!-- Before: boxes -->
  <rect x="40" y="90" width="140" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#166534">expand(newBelief)</text>

  <rect x="200" y="90" width="130" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="265" y="115" text-anchor="middle" font-size="11" fill="#166534">isConsistent?</text>

  <line x1="180" y1="110" x2="200" y2="110" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Before: branch -->
  <rect x="40" y="155" width="140" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#166534">revise(belief)</text>
  <text x="110" y="190" text-anchor="middle" font-size="10" fill="#4ade80">(always runs)</text>

  <!-- contradiction detected label -->
  <text x="265" y="148" text-anchor="middle" font-size="10" fill="#dc2626">contradiction = true</text>
  <line x1="265" y1="130" x2="265" y2="155" stroke="#dc2626" stroke-width="1" stroke-dasharray="4"/>
  <line x1="265" y1="155" x2="180" y2="175" stroke="#dc2626" stroke-width="1" stroke-dasharray="4"/>

  <rect x="40" y="215" width="290" height="40" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="185" y="237" text-anchor="middle" font-size="11" fill="#991b1b">if(contradicted) emit CONFLICT</text>

  <line x1="110" y1="195" x2="110" y2="215" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="185" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">contradiction detected BEFORE</text>
  <text x="185" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">revision resolves it</text>

  <!-- AFTER section -->
  <rect x="370" y="50" width="330" height="270" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="535" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">AFTER revision (broken)</text>

  <!-- After: boxes -->
  <rect x="390" y="90" width="290" height="40" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="535" y="112" text-anchor="middle" font-size="11" fill="#991b1b">revise(belief) + isConsistent?</text>

  <text x="535" y="155" text-anchor="middle" font-size="11" fill="#475569">revise() restores consistency</text>
  <text x="535" y="170" text-anchor="middle" font-size="11" fill="#475569">by construction</text>

  <line x1="535" y1="130" x2="535" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="390" y="195" width="290" height="40" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="535" y="212" text-anchor="middle" font-size="11" fill="#991b1b">isConsistent(updated)</text>
  <text x="535" y="227" text-anchor="middle" font-size="10" fill="#f87171">always true</text>

  <line x1="535" y1="178" x2="535" y2="195" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="535" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">check is tautologically true</text>
  <text x="535" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">notification never emitted</text>
</svg>
